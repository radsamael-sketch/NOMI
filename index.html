            <div class="nomi-settings-section-title"><small>02 · APPEARANCE</small><h3>Палитра оформления</h3><p>Выбери настроение NOMI. Выбор сохраняется автоматически.</p></div>
            <div class="nomi-settings-palettes">${Object.entries(NOMI_PALETTES).map(([name,p])=>`<button type="button" class="nomi-settings-palette ${name===current?'active':''}" data-settings-palette="${name}" aria-pressed="${name===current}"><span class="nomi-palette-swatches"><i style="background:${p.bg}"></i><i style="background:${p.main}"></i><i style="background:${p.accent}"></i><i style="background:${p.mint}"></i></span><b>${name}</b><small>${name==='Spring Bloom'?'светлая · цветочная':name==='Summer Haze'?'свежая · голубая':name==='Autumn Poetry'?'винная · глубокая':name==='Winter Velvet'?'холодная · бархатная':'тёмная · вечерняя'}</small></button>`).join('')}</div>
          </section>
          <section class="nomi-settings-section">
            <div class="nomi-settings-section-title"><small>03 · HOME PAGE</small><h3>Главная страница</h3><p>Выбери, какие дополнительные разделы показывать на обложке.</p></div>
            <div class="nomi-settings-toggles">
              <label><span><b>Мои моменты</b><small>Подборка фотографий на главной</small></span><input type="checkbox" data-settings-dashboard="moments" ${localStorage.getItem('nomi.dashboard.moments')!=='off'?'checked':''}></label>
              <label><span><b>Открытие дня</b><small>Факт, вопрос или творческая идея</small></span><input type="checkbox" data-settings-dashboard="discovery" ${localStorage.getItem('nomi.dashboard.discovery')!=='off'?'checked':''}></label>
              <label><span><b>Быстрый переход к привычкам</b><small>Ссылка на ежедневные привычки</small></span><input type="checkbox" data-settings-dashboard="habits" ${localStorage.getItem('nomi.dashboard.habits')!=='off'?'checked':''}></label>
            </div>
          </section>
          <section class="nomi-settings-section">
            <div class="nomi-settings-section-title"><small>04 · MY MOMENTS</small><h3>Фотографии</h3><p>Добавляй снимки, распределяй их по альбомам, закрепляй важные моменты и удаляй ненужные.</p></div>
            <button type="button" class="nomi-settings-primary" data-settings-action="photos">Открыть управление фотографиями <span>↗</span></button>
          </section>
          <section class="nomi-settings-section nomi-settings-data">
            <div class="nomi-settings-section-title"><small>05 · LOCAL DATA</small><h3>Резервная копия</h3><p>Экспорт и импорт работают локально и не требуют аккаунта. В полную копию входят записи, настройки и фотографии.</p></div>
            <div class="nomi-settings-data-actions"><button type="button" class="nomi-settings-primary" data-settings-action="export">Экспортировать все данные <span>↓</span></button><label class="nomi-settings-secondary">Импортировать копию <input type="file" id="nomi-settings-import" accept="application/json,.json" hidden></label></div>
            <p class="nomi-settings-footnote">Импорт предложит объединить данные или заменить текущие. Перед заменой рекомендуется сделать экспорт.</p>
          </section>
        </div>
        <footer class="nomi-settings-footer"><span>Локальные настройки доступны без входа в аккаунт.</span><button type="button" data-settings-close>Готово</button></footer>
      </section>`;
    document.body.append(overlay);
    const close = () => overlay.remove();
    overlay.addEventListener('click', async event => {
      if (event.target === overlay || event.target.closest('[data-settings-close]')) { close(); return; }
      const palette = event.target.closest('[data-settings-palette]');
      const action = event.target.closest('[data-settings-action]');
      if (palette) {
        const name = palette.dataset.settingsPalette;
        try {
          localStorage.setItem('nomi.palette', name);
          await NomiData.Settings.setTheme(name);
          applyPalette(name);
          overlay.querySelectorAll('[data-settings-palette]').forEach(button => {
            const active = button === palette;
            button.classList.toggle('active', active);
            button.setAttribute('aria-pressed', String(active));
          });
          toast('Палитра сохранена: ' + name);
        } catch (error) { console.error(error); toast('Не удалось сохранить палитру.'); }
        return;
      }
      if (!action) return;
      const kind = action.dataset.settingsAction;
      if (kind === 'photos') {
        try { await openPhotoSettings(); } catch (error) { console.error(error); toast(error.message || 'Не удалось открыть фотографии.'); }
      } else if (kind === 'export') {
        action.disabled = true;
        try { await exportBackup(true); } catch (error) { console.error(error); toast(error.message || 'Не удалось создать резервную копию.'); }
        finally { action.disabled = false; }
      }
    });
    overlay.addEventListener('change', async event => {
      if (event.target.id === 'nomi-settings-language') {
        const language = event.target.value;
        try {
          await NomiData.Settings.setLanguage(language);
          state.language = language;
          applyLanguageLabels();
          initPageShells();
          registerAllRenderers();
          window.NOMIEnhance?.();
          await renderAll();
          toast(language === 'ru' ? 'Язык сохранён.' : 'Language saved.');
        } catch (error) { console.error(error); toast('Не удалось сохранить язык.'); }
      }
      const toggle = event.target.closest('[data-settings-dashboard]');
      if (toggle) {
        const key = 'nomi.dashboard.' + toggle.dataset.settingsDashboard;
        localStorage.setItem(key, toggle.checked ? 'on' : 'off');
        const home = window.__nomiPageRenderers?.get('home');
        if (home) await home.render();
      }
      if (event.target.id === 'nomi-settings-import') {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const snapshot = JSON.parse(await file.text());
          NomiData.ExportImport.validateSnapshot(snapshot);
          close();
          openModal({
            title: t('import'),
            fields: [
              {name:'mode',label:t('importMode'),type:'select',value:'merge',options:[{value:'merge',label:t('merge')},{value:'replace',label:t('replace')}]},
              {name:'conflictPolicy',label:t('conflict'),type:'select',value:'skip',options:[{value:'skip',label:t('skip')},{value:'new',label:t('newIds')}]}
            ],
            onSave: async values => {
              if (values.mode === 'replace' && !window.confirm(t('replaceConfirm'))) return false;
              const result = await NomiData.ExportImport.importSnapshot(snapshot,{mode:values.mode,conflictPolicy:values.conflictPolicy});
              if (window.NOMIPhotoStore) await window.NOMIPhotoStore.restore(Array.isArray(snapshot.visualPhotos)?snapshot.visualPhotos:[],values.mode);
              const keys=['nomi.habits.v1','nomi.discovery','nomi.movies','nomi.libraryTab','nomi.palette','nomi.dashboard.moments','nomi.dashboard.discovery','nomi.dashboard.habits'];
              if (values.mode==='replace') keys.forEach(key=>localStorage.removeItem(key));
              if (snapshot.localData) for (const [key,value] of Object.entries(snapshot.localData)) if (values.mode==='replace'||localStorage.getItem(key)===null) localStorage.setItem(key,value);
              await NomiData.Settings.ensure();
              const fresh=await NomiData.Settings.get();
              state.language=fresh?.language||state.language;
              const paletteName=localStorage.getItem('nomi.palette')||fresh?.theme||'Spring Bloom';
              localStorage.setItem('nomi.palette',NOMI_PALETTES[paletteName]?paletteName:'Spring Bloom');
              applyPalette(localStorage.getItem('nomi.palette'));
              applyLanguageLabels(); initPageShells(); registerAllRenderers(); window.NOMIEnhance?.(); await renderAll();
              toast(t('importDone')+': '+JSON.stringify(result.counts));
              return true;
            }
          });
        } catch (error) { console.error(error); toast(t('invalidFile') + ': ' + (error.message || '')); }
      }
    });
    overlay.querySelector('#nomi-settings-language')?.focus();
  }
  function openExportModal() {
    openModal({title:t('export'),values:{includeAttachments:true},fields:[
      {name:'includeAttachments',label:t('includeAttachments'),type:'checkbox'}
    ],submit:t('export'),onSave:async v=>{await exportBackup(!!v.includeAttachments);}});
  }
  async function exportBackup(includeAttachments=true) {
    const ei=NomiData.ExportImport;
    const snapshot=await ei.dumpAll({excludeAttachments:!includeAttachments});
    const photoStore=window.NOMIPhotoStore;
    if(includeAttachments && photoStore){
      const photos=await photoStore.all();
      snapshot.visualPhotos=await Promise.all(photos.map(async p=>({id:p.id,createdAt:p.createdAt,day:p.day||null,pinned:!!p.pinned,album:p.album||'Без альбома',mime:p.blob?.type||'image/jpeg',dataUrl:await window.__NomiInternal.blobToDataUrl(p.blob)})));
      snapshot.visualPhotosExcluded=false;
    }else{snapshot.visualPhotos=[];snapshot.visualPhotosExcluded=true;}
    snapshot.localData={};for(const key of ['nomi.habits.v1','nomi.discovery','nomi.movies','nomi.libraryTab','nomi.palette','nomi.dashboard.moments','nomi.dashboard.discovery','nomi.dashboard.habits']){const value=localStorage.getItem(key);if(value!==null)snapshot.localData[key]=value;}
    const blob=ei.buildBackupBlob(snapshot);
    if(blob.size>50*1024*1024 && includeAttachments) {
      if(window.confirm(t('backupLarge'))) return exportBackup(false);
      return false;
    }
    ei.triggerDownload(blob,ei.buildBackupFilename('nomi-backup'));
    if(snapshot.attachmentsExcluded)toast(t('attachmentWarning'));else toast(t('backupDone'));
    return true;
  }
  async function renderAll() {
    const pages=['home','planner','tasks','journal','ideas','books','habits','moments','progress'];
    for(const p of pages) {
      const r=window.__nomiPageRenderers.get(p);
      if(r&&r.render) await r.render();
    }
  }
  function registerAllRenderers() {
    registerRenderer('home',renderHome);
    registerRenderer('planner',renderPlanner);
    registerRenderer('habits',renderHabits);
    registerRenderer('moments',renderMoments);
    registerRenderer('tasks',renderTasks);
    registerRenderer('journal',renderJournal,()=>revokePageUrls('journal'));
    registerRenderer('ideas',renderIdeas);
    registerRenderer('books',renderBooks,()=>revokePageUrls('books'));
    registerRenderer('progress',renderProgress);
  }

  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#nomiModal'))closeModal();});
  document.addEventListener('click',async e=>{
    const pageBtn=e.target.closest('[data-page]');if(pageBtn){e.preventDefault();setPage(pageBtn.dataset.page);return;}
    if(e.target.closest('[data-habit-add]')){addHabitQuick();return;}
    const ht=e.target.closest('[data-habit-toggle]');if(ht){const hs=readHabits(),h=hs.find(x=>x.id===ht.dataset.habitToggle);if(h){h.completed=h.completed||[];const k=dateKey();h.completed=h.completed.includes(k)?h.completed.filter(x=>x!==k):[...h.completed,k];writeHabits(hs);await renderHabits();}return;}
    const hd=e.target.closest('[data-habit-delete]');if(hd){writeHabits(readHabits().filter(x=>x.id!==hd.dataset.habitDelete));await renderHabits();return;}
    const mp=e.target.closest('[data-moment-pin]');if(mp){const ps=await window.NOMIPhotoStore.all(),p=ps.find(x=>x.id===mp.dataset.momentPin);if(p){p.pinned=!p.pinned;await window.NOMIPhotoStore.put(p);await renderMoments();}return;}
    const ma=e.target.closest('[data-moment-album]');if(ma){const ps=await window.NOMIPhotoStore.all(),p=ps.find(x=>x.id===ma.dataset.momentAlbum);if(p){p.album=prompt('Название альбома',p.album||'Без альбома')||p.album;await window.NOMIPhotoStore.put(p);await renderMoments();}return;}
    const md=e.target.closest('[data-moment-delete]');if(md){await window.NOMIPhotoStore.remove(md.dataset.momentDelete);await renderMoments();return;}
    const deviceButton=e.target.closest('#deviceSeg button');
    if(deviceButton){$$('#deviceSeg button').forEach(b=>b.classList.toggle('active',b===deviceButton));document.body.setAttribute('data-device',deviceButton.dataset.device);try{localStorage.setItem('nomi.deviceMode',deviceButton.dataset.device);}catch(_){}return;}
    if(e.target.closest('#collapseBtn')){const app=$('#app');app.classList.toggle('collapsed');$('#collapseBtn').textContent=app.classList.contains('collapsed')?'⟩':'⟨';return;}
    if(e.target.closest('#settingsBtn')){openSettings();return;}
    if(e.target.closest('#cloudBtn')){if(typeof window.NOMIOpenCloudPanel==='function')window.NOMIOpenCloudPanel();else toast('Модуль облака не загрузился. Локальные данные доступны.');return;}
    // Palette changes are handled only by the settings panel via [data-settings-palette].
    if(e.target.closest('[data-open-cloud]')){window.NOMIOpenCloudPanel?.();return;}
    const dashboardToggle=e.target.closest('[data-dashboard-toggle]');if(dashboardToggle){localStorage.setItem('nomi.dashboard.'+dashboardToggle.dataset.dashboardToggle,dashboardToggle.checked?'on':'off');const home=window.__nomiPageRenderers?.get('home');if(home)await home.render();return;}
    if(e.target.closest('#mobileMoreBtn')){$('#mobileMoreMenu')?.classList.toggle('open');return;}
    if(e.target.closest('#fab')){
      const p=state.activePage;
      if(p==='tasks'||p==='home')addTaskModal();
      else if(p==='planner')addPlannerEntryModal();
      else if(p==='habits')addHabitQuick();
      else if(p==='moments')openPhotoSettings();
      else if(p==='journal'){state.journalDate=dateKey();renderJournal().then(()=>$('#journalForm textarea[name=body]')?.focus());}
      else if(p==='ideas')addIdeaModal();
      else if(p==='books')addBookModal();
      else addTaskModal();
      return;
    }
    if(e.target.closest('[data-modal-close]')){closeModal();return;}
    const action=e.target.closest('[data-action]');
    if(action){try{await handleAction(action);}catch(err){console.error(err);toast(err.message||t('storageError'));}}
  });
  document.addEventListener('change',async e=>{
    if(e.target.id==='plannerDate'){state.plannerDate=e.target.value;state.calendarDate=parseDate(state.plannerDate);await renderPlanner();}
    if(e.target.id==='journalDate'){state.journalDate=e.target.value;await renderJournal();}
    if(e.target.id==='booksStatus'){state.booksStatus=e.target.value;await renderBooks();}
    if(e.target.id==='booksSort'){state.booksSort=e.target.value;await renderBooks();}
    if(e.target.id==='journalFile'){await addJournalFiles(Array.from(e.target.files||[]));}
    if(e.target.id==='momentsUpload'){for(const f of Array.from(e.target.files||[])){if(!f.type.startsWith('image/')||f.size>12*1024*1024)continue;await window.NOMIPhotoStore.put({id:newNomiId(),createdAt:new Date().toISOString(),day:dateKey(),pinned:false,album:'Без альбома',blob:f});}await renderMoments();await refreshAllVisible();}
    if(e.target.id==='deviceSeg' || e.target.matches('#deviceSeg button')) {
      if(e.target.matches('button')){ $$('#deviceSeg button').forEach(b=>b.classList.toggle('active',b===e.target));document.body.setAttribute('data-device',e.target.dataset.device);try{localStorage.setItem('nomi.deviceMode',e.target.dataset.device);}catch(_){} }
    }
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='ideasSearch'){const el=e.target,pos=el.selectionStart;state.ideasQuery=el.value;renderIdeas().then(()=>{const next=$('#ideasSearch');if(next){next.focus();try{next.setSelectionRange(pos,pos);}catch(_){}}});}
    if(e.target.id==='booksSearch'){state.booksQuery=e.target.value;renderBooks();}
    if(e.target.id==='journalSearchValue'){const pos=e.target.selectionStart;renderJournal().then(()=>{const el=$('#journalSearchValue');if(el){el.focus();el.setSelectionRange(pos,pos);}});}
  });
  document.addEventListener('submit',e=>{
    if(e.target.id==='journalForm'){e.preventDefault();saveJournal().catch(err=>toast(err.message));}
  });

  function tick(){const d=new Date();const c=$('#clock');if(c)c.textContent=d.toLocaleTimeString(state.language==='ru'?'ru-RU':'en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});}
  async function boot() {
    initPageShells();
    window.NomiData.onStatus = payload => {
      if(payload?.message) setStatus(payload.message, payload.kind==='fatal');
      if(payload?.kind==='fatal') $('#app')?.classList.add('app-ready');
    };
    window.NomiData.onError = payload => { if(payload?.message) setStatus(payload.message,true); };
    const savedMode=(()=>{try{return localStorage.getItem('nomi.deviceMode');}catch(_){return null;}})();
    const initialMode=savedMode||((navigator.maxTouchPoints>0&&window.innerWidth>=761&&window.innerWidth<=1280)?'tablet':null);
    if(initialMode){document.body.setAttribute('data-device',initialMode);$$('#deviceSeg button').forEach(b=>b.classList.toggle('active',b.dataset.device===initialMode));}
    tick();setInterval(tick,15000);
    setStatus(state.language==='ru'?'Подключение локальной базы…':'Opening local database…');
    try {
      await window.NomiData.boot();
      const settings=await NomiData.Settings.get();state.language=settings?.language||'ru';const savedPalette=localStorage.getItem('nomi.palette');const activePalette=savedPalette&&NOMI_PALETTES[savedPalette]?savedPalette:'Spring Bloom';applyPalette(activePalette);if(!savedPalette){localStorage.setItem('nomi.palette',activePalette);NomiData.Settings.setTheme(activePalette).catch(()=>{});}let plannerMigrationError=null;try{await migratePlannerNotesToIdeas();}catch(migrationError){plannerMigrationError=migrationError;console.error('Planner notes migration failed; source notes preserved where migration was not verified.',migrationError);}
      window.__nomiReady=true;applyLanguageLabels();initPageShells();registerAllRenderers();
      $('#app')?.classList.add('app-ready');
      setStatus(t('localReady'));
      setPage('home');
      if(typeof window.__nomiOnReady==='function')window.__nomiOnReady();if(plannerMigrationError)toast('Не удалось завершить перенос заметок. Исходные данные сохранены для проверки.');
      if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('SW registration failed',err));
    } catch(err) {
      console.error(err);setStatus('Ошибка локальной базы',true);$('#app')?.classList.add('app-ready');
      const home=pageContainer('home');if(home)home.innerHTML=`<div class="boot-error"><h2>Не удалось открыть NOMI</h2><p>${esc(err.message)}</p><button class="btn-primary" id="retryBoot">Повторить запуск</button></div>`;
    }
  }
  document.addEventListener('DOMContentLoaded',boot);
  document.addEventListener('click',e=>{if(e.target.id==='retryBoot')location.reload();});
})();

</script>
<script>
/* NOMI local-first visual extensions: photos, curated Discovery and existing library extras. */
(()=>{
 const DB='nomi-personal-extras',STORE='photos';let dbp;
 const openDB=()=>dbp||(dbp=new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);}));
 const all=async()=>{const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});};
 const put=async x=>{const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(x);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});};
 const remove=async id=>{const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});};
 const get=(k,d)=>{try{return JSON.parse(localStorage.getItem('nomi.'+k))??d}catch(_){return d}},set=(k,v)=>localStorage.setItem('nomi.'+k,JSON.stringify(v));
 window.NOMIPhotoStore={all,put,remove,restore:async(items,mode)=>{if(mode==='replace'){for(const p of await all())await remove(p.id);}for(const item of items||[]){if(mode==='merge'&&(await all()).some(p=>p.id===item.id))continue;await put({id:item.id,createdAt:item.createdAt,day:item.day||null,pinned:!!item.pinned,album:item.album||'Без альбома',blob:window.__NomiInternal.dataUrlToBlob(item.dataUrl,item.mime)});}}};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const discoveries=[
  ['Мода · История','В 1965 году Ив Сен-Лоран показал платья, вдохновлённые композициями Пита Мондриана: живопись буквально стала выкройкой.'],
  ['Искусство · Техника','Британская ботаник Анна Аткинс в 1840-х создавала книги о водорослях с помощью цианотипии — фотографического процесса, дающего характерный прусский синий цвет.'],
  ['Английский · Этимология','Слово “clue” когда-то означало клубок нити. Значение «подсказка» закрепилось благодаря мифу о нити Ариадны, которая помогла Тесею найти выход из лабиринта.'],
  ['Мода · Дизайн','Платье с омаром Эльзы Скиапарелли 1937 года было создано при участии Сальвадора Дали. Это один из ранних ярких примеров сюрреализма в высокой моде.'],
  ['Искусство · История','Баухаус не ограничивался архитектурой: в его мастерских текстиля исследовали геометрию, цвет и фактуру как полноценные инструменты современного дизайна.'],
  ['Английский мир · Литература','Первый номер Vogue вышел в Нью-Йорке в 1892 году — изначально это был еженедельный журнал о моде, общественной жизни и культуре.'],
  ['Мода · Архив','В 1947 году коллекция Кристиана Диора получила название “New Look” благодаря редактору Harper’s Bazaar Кармел Сноу: силуэт с подчёркнутой талией стал символом послевоенной моды.'],
  ['Английский · Слова','“Bookkeeper” примечательно тем, что в нём подряд стоят три пары одинаковых букв: oo, kk и ee.'],
  ['Кино · Костюм','Костюмы в фильме “In the Mood for Love” меняются вместе с эмоциональным ритмом истории: повторяющиеся силуэты и узоры становятся частью повествования.'],
  ['Искусство · Материал','Первые известные бумажные обои в Европе были дорогой альтернативой гобеленам и часто имитировали ткани, архитектурные панели и декоративные фризы.'],

  ['Мода · Культура','Парижская выставка декоративного искусства 1925 года дала название стилю ар-деко, хотя само выражение “Art Deco” стало широко употребляться значительно позже.'],
  ['Литература · Английский мир','В английском слове “serendipity” заключена идея неожиданной удачной находки — слово связано с названием старого сказочного государства Serendip.'],

  ['Мини-исследование · Дизайн','Найди две обложки альбомов одного десятилетия и сравни их типографику: что в них говорит о времени лучше, чем название?'],

 ];
 function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
 async function renderDiary(){
  const host=document.querySelector('#content-home');if(!host)return;
  const previous=host.querySelector('#nomi-home-editorial');previous?._urls?.forEach(URL.revokeObjectURL);previous?.remove();
  host.querySelector('.nomi-visual-diary')?.remove();host.querySelector('.nomi-discovery')?.remove();host.querySelector('.dashboard-habits-link')?.remove();
  const photos=await all();
  const pinned=photos.find(x=>x.pinned),todays=photos.filter(x=>x.day===today());
  const chosen=pinned||todays[todays.length-1]||photos[photos.length-1];
  const showMoments=localStorage.getItem('nomi.dashboard.moments')!=='off';
  const showDiscovery=localStorage.getItem('nomi.dashboard.discovery')!=='off';
  const showHabits=localStorage.getItem('nomi.dashboard.habits')!=='off';
  const root=document.createElement('section');root.id='nomi-home-editorial';root.className='nomi-home-editorial';const urls=[];
  const imageUrl=photo=>{const u=URL.createObjectURL(photo.blob);urls.push(u);return u;};
  const moments=chosen?`<div class="nomi-moments-image"><img src="${imageUrl(chosen)}" alt="Мой момент"><span>${esc(chosen.day||'')}</span></div><div class="nomi-moments-thumbs">${photos.filter(x=>x.id!==chosen.id).slice(-3).map(x=>`<img src="${imageUrl(x)}" alt="Фотография из галереи">`).join('')}</div>`:`<div class="nomi-moments-empty"><span class="nomi-moments-empty-mark">✳</span><p>Здесь будут фотографии, к которым захочется возвращаться.</p><button type="button" data-page="moments">Добавить первый момент <span>↗</span></button></div>`;
  const momentSection=`<article class="nomi-moments-editorial"><div class="nomi-editorial-kicker">A LITTLE GALLERY <span>01</span></div><div class="nomi-editorial-heading"><div><h2>Мои моменты</h2><p>Фрагменты жизни, которые хочется сохранить.</p></div><button type="button" data-page="moments" class="nomi-text-link">Вся галерея ↗</button></div>${moments}</article>`;
  const d=get('discovery',{index:0,favorite:[],day:null});if(d.day!==today()){d.index=Math.floor(new Date(today()+'T12:00:00').getTime()/86400000)%discoveries.length;d.day=today();set('discovery',d);}
  const idx=(d.index||0)%discoveries.length,item=discoveries[idx],fav=(d.favorite||[]).some(x=>x.text===item[1]);
  const discoverySection=`<article class="nomi-discovery-editorial"><div class="nomi-editorial-kicker">DISCOVERY OF THE DAY <span>${String(idx+1).padStart(2,'0')}</span></div><div class="nomi-discovery-category">${esc(item[0])}</div><h2>${esc(item[1])}</h2><div class="nomi-discovery-footer"><button type="button" data-nomi="next-discovery" class="nomi-discovery-next">Следующее открытие <span>↗</span></button><button type="button" data-nomi="favorite-discovery" class="nomi-discovery-favorite">${fav?'♥ В избранном':'♡ В избранное'}</button></div></article>`;
  const habitSection=`<aside class="nomi-habit-editorial"><div class="nomi-habit-symbol">✳</div><div><small>GENTLE ROUTINE</small><h3>Маленькие привычки — большие перемены.</h3><p>Отметь небольшой шаг, который сделает сегодняшний день лучше.</p></div><button type="button" data-page="habits">Мои привычки <span>↗</span></button></aside>`;
  root.innerHTML=`<div class="nomi-editorial-grid">${showMoments?momentSection:''}${showDiscovery?discoverySection:''}</div>${showHabits?habitSection:''}`;
  root._urls=urls;host.append(root);
 }
 function renderMovies(){const root=document.querySelector('#content-books');if(!root)return;const tabs=document.createElement('div');tabs.className='nomi-book-tabs';tabs.innerHTML=`<button data-nomi="tab-books" class="${get('libraryTab','books')==='books'?'active':''}">Книги</button><button data-nomi="tab-movies" class="${get('libraryTab','books')==='movies'?'active':''}">Фильмы</button>`;root.prepend(tabs);if(get('libraryTab','books')==='movies'){const movies=get('movies',[]);const section=document.createElement('section');section.className='nomi-movies';section.innerHTML=`<div class="nomi-extra-head"><h2>Фильмы</h2><button class="btn-primary" data-nomi="add-movie">＋ Добавить фильм</button></div>${movies.map((m,i)=>`<article class="nomi-movie"><div><b>${esc(m.title)}</b><small>Оценка: ${m.rating}/5</small></div><button data-nomi="delete-movie" data-id="${i}">Удалить</button></article>`).join('')||'<p>Пока здесь пусто.</p>'}`;root.append(section);root.querySelector('.page-toolbar')?.setAttribute('hidden','');root.querySelector('.books-grid')?.setAttribute('hidden','');}}
 function enhance(){const home=window.__nomiPageRenderers?.get('home');if(home&&!home.__extras){const old=home.render;home.render=async()=>{const previous=document.querySelector('#nomi-visual-diary');previous?._urls?.forEach(URL.revokeObjectURL);await old();await renderDiary();};home.__extras=true;}const books=window.__nomiPageRenderers?.get('books');if(books&&!books.__extras){const old=books.render;books.render=async()=>{await old();renderMovies();};books.__extras=true;}}
 const style=document.createElement('style');style.textContent=`.nomi-extra,.nomi-discovery{margin:26px 0;padding:18px 0;border-top:1px solid rgba(41,38,49,.14)}.nomi-extra-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.nomi-extra small,.nomi-discovery small{font:10px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--cherry)}.nomi-extra h2{font:600 27px 'Cormorant Garamond',serif;margin:5px 0}.nomi-photo-stage{min-height:140px;max-height:240px;margin:14px 0;background:var(--lilac);overflow:hidden}.nomi-photo-stage img{display:block;width:100%;height:240px;object-fit:cover}.nomi-photo-strip{display:flex;gap:10px;overflow:auto}.nomi-photo-strip>div{flex:0 0 82px;height:82px}.nomi-photo-strip img{width:100%;height:100%;object-fit:cover}.nomi-discovery{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:end;border-bottom:1px solid rgba(41,38,49,.14)}.nomi-discovery>small,.nomi-discovery h3{grid-column:1/-1}.nomi-discovery-type{font:11px 'IBM Plex Mono',monospace;color:var(--cherry)}.nomi-discovery h3{font:600 clamp(22px,2.5vw,30px) 'Cormorant Garamond',serif;line-height:1.25;margin:0;max-width:820px}.nomi-discovery-actions{display:flex;gap:14px}.nomi-discovery button{border:0;background:none;color:var(--cherry);padding:8px 0;font-size:11px}.nomi-book-tabs{display:flex;gap:8px;margin:12px 0 20px}.nomi-book-tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:10px 16px;color:var(--muted)}.nomi-book-tabs button.active{border-color:var(--berry);color:var(--cherry)}.nomi-movie{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #ddd;gap:16px}.nomi-movie small{display:block}@media(max-width:620px){.nomi-extra-head{align-items:flex-start;flex-direction:column}.nomi-discovery{grid-template-columns:1fr}.nomi-discovery>small,.nomi-discovery h3{grid-column:1}.nomi-discovery-actions{flex-wrap:wrap}}`;document.head.append(style);
 document.addEventListener('click',async e=>{const b=e.target.closest('[data-nomi]');if(!b)return;const a=b.dataset.nomi;if(a==='next-discovery'){const x=get('discovery',{index:0,favorite:[]});x.index=(x.index+1)%discoveries.length;set('discovery',x);await renderDiary();}if(a==='favorite-discovery'){const x=get('discovery',{index:0,favorite:[]}),item=discoveries[x.index%discoveries.length];x.favorite=x.favorite||[];if(!x.favorite.some(y=>y.text===item[1]))x.favorite.push({type:item[0],text:item[1]});else x.favorite=x.favorite.filter(y=>y.text!==item[1]);set('discovery',x);await renderDiary();}if(a==='tab-books'||a==='tab-movies'){set('libraryTab',a==='tab-movies'?'movies':'books');const page=window.__nomiPageRenderers?.get('books');if(page)await page.render();}if(a==='add-movie'){const title=prompt('Название фильма');if(title?.trim()){const rating=Number(prompt('Оценка от 1 до 5','5')),m=get('movies',[]);m.push({title:title.trim(),rating:Math.max(1,Math.min(5,Number.isFinite(rating)?rating:5))});set('movies',m);const page=window.__nomiPageRenderers?.get('books');if(page)await page.render();}}if(a==='delete-movie'){const m=get('movies',[]);m.splice(Number(b.dataset.id),1);set('movies',m);const page=window.__nomiPageRenderers?.get('books');if(page)await page.render();}});
 window.NOMIEnhance=enhance;
 const poll=setInterval(()=>{if(window.__nomiReady&&window.__nomiPageRenderers?.size){enhance();clearInterval(poll);window.__nomiPageRenderers.get('home')?.render?.();}},250);
})();
</script>
