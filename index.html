  function validateSettings(s) {
    assert(isPlainObject(s), 'Settings должен быть объектом');
    assert(s.id === SETTINGS_ID, 'Settings.id должен быть "' + SETTINGS_ID + '"');
    assert(s.language === 'ru' || s.language === 'en', 'Settings.language: ru | en');
    assert(typeof s.theme === 'string' && s.theme.length > 0, 'Settings.theme: непустая строка');
    assert(Number.isInteger(s.schemaVersion) && s.schemaVersion >= 1,
      'Settings.schemaVersion: integer >= 1');
    return true;
  }

  function normalizeSettings(input, opts) {
    const o = opts || {};
    const src = input || {};
    return {
      id: SETTINGS_ID,
      language: (src.language === 'ru' || src.language === 'en') ? src.language : DEFAULT_SETTINGS.language,
      theme: (typeof src.theme === 'string' && src.theme.length > 0) ? src.theme : DEFAULT_SETTINGS.theme,
      schemaVersion: Number.isInteger(src.schemaVersion) && src.schemaVersion >= 1
        ? src.schemaVersion : (o.fallbackSchemaVersion || DB_VERSION)
    };
  }

  function createSettings(storage) {
    return {
      async get() {
        const raw = await storage.getSettings();
        if (!raw) return null;
        return raw;
      },

      async ensure() {
        const existing = await storage.getSettings();
        if (existing) return existing;
        const fresh = normalizeSettings(DEFAULT_SETTINGS, { fallbackSchemaVersion: DB_VERSION });
        validateSettings(fresh);
        await withWriteLock(async () => {
          const again = await storage.getSettings();
          if (again) return again;
          await storage.putSettings(fresh);
          return fresh;
        });
        return fresh;
      },

      async update(patch) {
        assert(isPlainObject(patch), 'Settings.update: patch должен быть объектом');
        return withWriteLock(async () => {
          const current = await storage.getSettings();
          const base = current || normalizeSettings(DEFAULT_SETTINGS, { fallbackSchemaVersion: DB_VERSION });
          const merged = Object.assign({}, base, patch || {}, { id: SETTINGS_ID });
          const normalized = normalizeSettings(merged, { fallbackSchemaVersion: base.schemaVersion });
          validateSettings(normalized);
          await storage.putSettings(normalized);
          return normalized;
        });
      },

      async getLanguage() {
        const s = await storage.getSettings();
        return s ? s.language : DEFAULT_SETTINGS.language;
      },

      async setLanguage(lang) {
        assert(lang === 'ru' || lang === 'en', 'setLanguage: ru | en');
        return this.update({ language: lang });
      },

      async getTheme() {
        const s = await storage.getSettings();
        return s ? s.theme : DEFAULT_SETTINGS.theme;
      },

      async setTheme(theme) {
        assert(typeof theme === 'string' && theme.length > 0, 'setTheme: непустая строка');
        return this.update({ theme: theme });
      },

      _normalize: normalizeSettings,
      _validate: validateSettings

  /* ---------------------------------------------------------------
     Migrations: описания схемы и апгрейды

     Все операции в onupgradeneeded — только синхронные.
     meta.schemaVersion пишется последней в той же versionchange-транзакции.
     --------------------------------------------------------------- */

  /* Построители индексов. Каждый принимает store (IDBObjectStore).
     Все индексы соответствуют утверждённой схеме. */
  function buildSchemaV1(db, tx) {
    /* Утилита: создать store, если его нет. */
    function ensureStore(name, options) {
      if (db.objectStoreNames.contains(name)) {
        return tx.objectStore(name);
      }
      /* Для создания используем переданную versionchange-транзакцию */
      return db.createObjectStore(name, options || {});
    }

    /* tasks: by_date, by_status */
    {
      const store = ensureStore(STORE.TASKS, { keyPath: 'id' });
      if (!store.indexNames.contains('by_date')) store.createIndex('by_date', 'dueDate', { unique: false });
      if (!store.indexNames.contains('by_status')) store.createIndex('by_status', 'status', { unique: false });
    }

    /* planner_entries: by_date, by_task */
    {
      const store = ensureStore(STORE.PLANNER_ENTRIES, { keyPath: 'id' });
      if (!store.indexNames.contains('by_date')) store.createIndex('by_date', 'date', { unique: false });
      if (!store.indexNames.contains('by_task')) store.createIndex('by_task', 'linkedTaskId', { unique: false });
    }

    /* planner_notes: by_date */
    {
      const store = ensureStore(STORE.PLANNER_NOTES, { keyPath: 'id' });
      if (!store.indexNames.contains('by_date')) store.createIndex('by_date', 'date', { unique: false });
    }

    /* events: by_date */
    {
      const store = ensureStore(STORE.EVENTS, { keyPath: 'id' });
      if (!store.indexNames.contains('by_date')) store.createIndex('by_date', 'date', { unique: false });
    }

    /* journal: by_date уникальный */
    {
      const store = ensureStore(STORE.JOURNAL, { keyPath: 'id' });
      if (!store.indexNames.contains('by_date')) store.createIndex('by_date', 'date', { unique: true });
    }

    /* attachments: by_owner (по ключу ownerKey = ownerType + ':' + ownerId) */
    {
      const store = ensureStore(STORE.ATTACHMENTS, { keyPath: 'id' });
      if (!store.indexNames.contains('by_owner')) store.createIndex('by_owner', 'ownerKey', { unique: false });
    }

    /* ideas: by_kind */
    {
      const store = ensureStore(STORE.IDEAS, { keyPath: 'id' });
      if (!store.indexNames.contains('by_kind')) store.createIndex('by_kind', 'kind', { unique: false });
    }

    /* books: by_status */
    {
      const store = ensureStore(STORE.BOOKS, { keyPath: 'id' });
      if (!store.indexNames.contains('by_status')) store.createIndex('by_status', 'status', { unique: false });
    }

    /* settings: без индексов, одна запись id="settings" */
    {
      ensureStore(STORE.SETTINGS, { keyPath: 'id' });
    }

    /* meta: keyPath 'key', без индексов */
    {
      ensureStore(STORE.META, { keyPath: 'key' });
    }

    /* Здесь только создание stores/indexes. Запись schemaVersion и settings
       выполняется централизованно в Migrations.upgrade. */
  }

  /* Реестр миграций: ключ — целевая версия, функция получает { db, tx }.
     Все операции строго синхронные. */
  const MIGRATIONS = {
    1: function migrationV1(ctx) {
      /* Базовая схема создаётся buildSchemaV1. */
      void ctx;
    },
    2: function migrationV2({ db }) {
      /* Пользователь отказался от финансового модуля: удалить его хранилища
         при обновлении существующей локальной базы. */
      ['transactions', 'finance_categories', 'budgets'].forEach((name) => {
        if (db.objectStoreNames.contains(name)) db.deleteObjectStore(name);
      });
    }
  };

  const Migrations = {
    DB_VERSION: DB_VERSION,
    MIGRATIONS: MIGRATIONS,

    /* Полное создание схемы (используется в onupgradeneeded). */
    createFreshSchema(db, tx) {
      buildSchemaV1(db, tx);
    },

    /* Обработчик onupgradeneeded: создаёт stores/индексы, вызывает MIGRATIONS[v]
       для каждой версии от oldVersion+1 до newVersion, и пишет schemaVersion последней.
       Возвращает управление после всех синхронных операций. */
    upgrade({ db, oldVersion, newVersion, tx }) {
      if (oldVersion === 0) {
        /* Только новая база получает базовую схему v1. */
        buildSchemaV1(db, tx);
      }

      /* Для существующей базы выполняются только последовательные миграции.
         Базовая схема повторно не создаётся и существующие настройки не трогаются. */
      for (let v = oldVersion + 1; v <= newVersion; v++) {
        if (v === 1 && oldVersion === 0) continue;
        const fn = MIGRATIONS[v];
        if (typeof fn !== 'function') {
          throw new Error('Отсутствует миграция NOMI DB v' + v);
        }
        fn({ db, tx });
      }

      if (oldVersion === 0) {
        tx.objectStore(STORE.SETTINGS).put(normalizeSettings(
          Object.assign({}, DEFAULT_SETTINGS, { schemaVersion: newVersion }),
          { fallbackSchemaVersion: newVersion }
        ));
      }

      /* Единственная и последняя запись версии схемы в versionchange tx. */
      tx.objectStore(STORE.META).put({ key: 'schemaVersion', value: newVersion });
    },

    /* Вспомогательная функция — только для новых баз. */
    buildFreshSchemaOnly(db, tx) {
      buildSchemaV1(db, tx);
    }
  };

  NOMI.createSettings = createSettings;
  NOMI.normalizeSettings = normalizeSettings;
  NOMI.validateSettings = validateSettings;
  NOMI.MIGRATIONS = MIGRATIONS;
  NOMI.Migrations = Migrations;
  NOMI.buildSchemaV1 = buildSchemaV1;

  NomiData.Settings = createSettings;
  NomiData.Migrations = Migrations;
  /* ---------------------------------------------------------------
     Утилиты для attachments: Blob <-> dataURL
     --------------------------------------------------------------- */
  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      try {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(reader.error || new Error('FileReader error'));
        reader.readAsDataURL(blob);
      } catch (e) {
        reject(toError(e, 'blobToDataUrl failed'));
      }
    });
  }

  function dataUrlToBlob(dataUrl, fallbackMime) {
    assert(typeof dataUrl === 'string' && dataUrl.length > 0, 'dataUrlToBlob: пустой dataURL');
    const match = /^data:([^;,]+)?(;base64)?,(.*)$/i.exec(dataUrl);
    if (!match) throw new Error('dataUrlToBlob: некорректный dataURL');
    const mime = match[1] || fallbackMime || 'application/octet-stream';
    const isBase64 = !!match[2];
    const payload = match[3] || '';
    let bytes;
    if (isBase64) {
      const bin = atob(payload);
      bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    } else {
      const decoded = decodeURIComponent(payload);
      bytes = new Uint8Array(decoded.length);
      for (let i = 0; i < decoded.length; i++) bytes[i] = decoded.charCodeAt(i) & 0xff;
    }
    return new Blob([bytes], { type: mime });
  }

  /* ---------------------------------------------------------------
     ExportImport
     --------------------------------------------------------------- */
  function createExportImport(storage, repo) {
    assert(storage instanceof Storage, 'ExportImport: требуется Storage');
    assert(repo && typeof repo === 'object', 'ExportImport: требуется Repo');

    /* Собрать полный снимок базы.
       attachments физически разрезаются на:
         — data.attachments_meta[] (без blob)
         — attachments[] (top-level) [{ id, dataUrl }]
       settings — одиночный объект.
       meta — массив [{key, value}].
       attachmentsExcluded — флаг; при dumpAll() ставим false (blob включены). */
    async function dumpAll(opts) {
      const o = opts || {};
      const excludeAttachments = !!o.excludeAttachments;

      const data = {};
      const mainStores = [
        STORE.TASKS,
        STORE.PLANNER_ENTRIES,
        STORE.PLANNER_NOTES,
        STORE.EVENTS,
        STORE.JOURNAL,
        STORE.IDEAS,
        STORE.BOOKS
      ];
      for (const s of mainStores) {
        data[s] = await storage.getAll(s);
      }

      /* attachments */
      const rawAtts = await storage.getAll(STORE.ATTACHMENTS);
      const attsMeta = [];
      const attsBlob = [];
      let missingBlob = false;
      for (const a of rawAtts) {
        const meta = Object.assign({}, a);
        delete meta.blob;
        if (!meta.ownerKey && meta.ownerType && meta.ownerId) {
          meta.ownerKey = attachmentOwnerKey(meta.ownerType, meta.ownerId);
        }
        attsMeta.push(meta);
        if (!excludeAttachments) {
          if (isBlob(a.blob)) {
            const dataUrl = await blobToDataUrl(a.blob);
            attsBlob.push({ id: a.id, dataUrl });
          } else {
            missingBlob = true;
          }
        }
      }
      /* Не создаём частичный backup изображений: если хотя бы один Blob
         недоступен, явно помечаем, что бинарные вложения исключены. */
      const attachmentsExcluded = excludeAttachments || missingBlob;
      if (attachmentsExcluded) attsBlob.length = 0;
      data.attachments_meta = attsMeta;

      /* settings */
      const settings = await storage.getSettings();
      const meta = await storage.getAllMeta();

      const snapshot = {
        format: SNAPSHOT_FORMAT,
        version: SNAPSHOT_VERSION,
        schemaVersion: await getActualSchemaVersion(storage),
        exportedAt: nowIso(),
        attachmentsExcluded: attachmentsExcluded,
        data: data,
        settings: settings || null,
        meta: meta,
        attachments: attachmentsExcluded ? [] : attsBlob
      };
      return snapshot;
    }

    /* ---- валидаторы snapshot ---- */
    function validateSnapshotStructure(snapshot) {
      assert(isPlainObject(snapshot), 'snapshot должен быть объектом');
      assert(snapshot.format === SNAPSHOT_FORMAT, 'snapshot.format: "' + SNAPSHOT_FORMAT + '"');
      assert(snapshot.version === SNAPSHOT_VERSION, 'snapshot.version: ' + SNAPSHOT_VERSION);
      assert(Number.isInteger(snapshot.schemaVersion) && snapshot.schemaVersion >= 1,
        'snapshot.schemaVersion: integer >= 1');
      assert(isValidIsoUtc(snapshot.exportedAt), 'snapshot.exportedAt: ISO UTC');
      assert(typeof snapshot.attachmentsExcluded === 'boolean', 'snapshot.attachmentsExcluded: boolean');
      assert(isPlainObject(snapshot.data), 'snapshot.data: объект');
      assert(Array.isArray(snapshot.meta), 'snapshot.meta: массив');
      assert(Array.isArray(snapshot.attachments), 'snapshot.attachments: массив');
      assert(snapshot.settings === null || isPlainObject(snapshot.settings),
        'snapshot.settings: объект или null');
      return true;
    }

    function validateUniqueIds(list, label) {
      if (!Array.isArray(list)) throw new Error('validateUniqueIds: ' + label + ' — не массив');
      const seen = new Set();
      for (const row of list) {
        if (!row || typeof row !== 'object') throw new Error(label + ': элемент не объект');
        if (typeof row.id !== 'string' || !row.id) throw new Error(label + ': id отсутствует');
        if (seen.has(row.id)) throw new Error(label + ': дубликат id ' + row.id);
        seen.add(row.id);
      }
      return true;
    }

    function validateSnapshot(snapshot) {
      validateSnapshotStructure(snapshot);

      const data = snapshot.data;
      const requiredDataArrays = [
        STORE.TASKS,
        STORE.PLANNER_ENTRIES,
        STORE.PLANNER_NOTES,
        STORE.EVENTS,
        STORE.JOURNAL,
        STORE.IDEAS,
        STORE.BOOKS,
        'attachments_meta'
      ];
      for (const k of requiredDataArrays) {
        if (!Array.isArray(data[k])) throw new Error('snapshot.data.' + k + ': массив обязателен');
        validateUniqueIds(data[k], 'snapshot.data.' + k);
      }

      /* Полярная проверка каждой сущности по модели */
      for (const t of data[STORE.TASKS]) validateTask(t);
      for (const e of data[STORE.PLANNER_ENTRIES]) validatePlannerEntry(e);
      for (const n of data[STORE.PLANNER_NOTES]) validatePlannerNote(n);
      for (const ev of data[STORE.EVENTS]) validateEvent(ev);
      for (const j of data[STORE.JOURNAL]) validateJournalEntry(j);
      for (const idea of data[STORE.IDEAS]) validateIdea(idea);
      for (const bk of data[STORE.BOOKS]) validateBook(bk);

      /* attachments_meta — без blob, но с ownerType/ownerId */
      for (const a of data.attachments_meta) {
        if (!a || typeof a !== 'object') throw new Error('attachments_meta: элемент не объект');
        if (a.ownerType !== ATTACHMENT_OWNER.JOURNAL && a.ownerType !== ATTACHMENT_OWNER.BOOK) {
          throw new Error('attachments_meta.ownerType недопустим: ' + a.ownerType);
        }
        if (typeof a.ownerId !== 'string' || !a.ownerId) {
          throw new Error('attachments_meta.ownerId обязателен');
        }
        if ('blob' in a) {
          throw new Error('attachments_meta не должен содержать blob (id=' + a.id + ')');
        }
      }

      /* settings */
      if (snapshot.settings !== null) {
        /* Для snapshot допустим settings без проверки schemaVersion — но
           требованиям соответствия settings-модели удовлетворяет. */
        if (snapshot.settings.id !== SETTINGS_ID) {
          throw new Error('snapshot.settings.id должен быть "' + SETTINGS_ID + '"');
        }
        if (snapshot.settings.language !== 'ru' && snapshot.settings.language !== 'en') {
          throw new Error('snapshot.settings.language: ru | en');
        }
        if (typeof snapshot.settings.theme !== 'string' || !snapshot.settings.theme) {
          throw new Error('snapshot.settings.theme: непустая строка');
        }
        if (!Number.isInteger(snapshot.settings.schemaVersion) || snapshot.settings.schemaVersion < 1) {
          throw new Error('snapshot.settings.schemaVersion: integer >= 1');
        }
      }

      /* meta */
      const metaKeys = new Set();
      for (const m of snapshot.meta) {
        if (!m || typeof m !== 'object') throw new Error('snapshot.meta: элемент не объект');
        if (typeof m.key !== 'string' || !m.key) throw new Error('snapshot.meta.key обязателен');
        if (metaKeys.has(m.key)) throw new Error('snapshot.meta: дубликат key ' + m.key);
        metaKeys.add(m.key);
        if (!('value' in m)) throw new Error('snapshot.meta.value обязателен');
      }

      /* attachments ↔ attachments_meta */
      const metaIds = new Set(data.attachments_meta.map((a) => a.id));
      if (snapshot.attachmentsExcluded === true) {
        if (snapshot.attachments.length !== 0) {
          throw new Error('attachmentsExcluded=true: snapshot.attachments должен быть пустым');
        }
      } else {
        const attIds = new Set();
        for (const a of snapshot.attachments) {
          if (!a || typeof a !== 'object') throw new Error('snapshot.attachments[i] — не объект');
          if (typeof a.id !== 'string' || !a.id) throw new Error('snapshot.attachments.id обязателен');
          if (attIds.has(a.id)) throw new Error('snapshot.attachments: дубликат id ' + a.id);
          attIds.add(a.id);
          if (typeof a.dataUrl !== 'string' || !a.dataUrl) {
            throw new Error('snapshot.attachments.dataUrl обязателен для id=' + a.id);
          }
        }
        if (metaIds.size !== attIds.size) {
          throw new Error('attachments_meta и attachments должны совпадать по количеству');
        }
        for (const id of metaIds) {
          if (!attIds.has(id)) throw new Error('attachments_meta id ' + id + ' отсутствует в attachments');
        }
        for (const id of attIds) {
          if (!metaIds.has(id)) throw new Error('attachments id ' + id + ' отсутствует в attachments_meta');
        }
      }

      /* Ссылки: Attachment.ownerType/ownerId -> владелец */
      const journalIds = new Set(data[STORE.JOURNAL].map((j) => j.id));
      const bookIds = new Set(data[STORE.BOOKS].map((b) => b.id));
      for (const a of data.attachments_meta) {
        const owners = a.ownerType === ATTACHMENT_OWNER.JOURNAL ? journalIds : bookIds;
        if (!owners.has(a.ownerId)) {
          throw new Error('Attachment.ownerId не найден среди владельцев: ' + a.ownerType + '/' + a.ownerId);
        }
        if (a.ownerKey && a.ownerKey !== attachmentOwnerKey(a.ownerType, a.ownerId)) {
          throw new Error('Attachment.ownerKey не соответствует ownerType/ownerId: ' + a.id);
        }
      }

      /* Ссылки: Book.coverAttachmentId -> attachments_meta */
      for (const bk of data[STORE.BOOKS]) {
        if (bk.coverAttachmentId) {
          if (!metaIds.has(bk.coverAttachmentId)) {
            throw new Error('Book.coverAttachmentId не найден в attachments_meta: ' + bk.coverAttachmentId);
          }
        }
      }

      /* Ссылки: PlannerEntry.linkedTaskId -> Task.id */
      const taskIds = new Set(data[STORE.TASKS].map((t) => t.id));
      for (const e of data[STORE.PLANNER_ENTRIES]) {
        if (e.linkedTaskId && !taskIds.has(e.linkedTaskId)) {
          throw new Error('PlannerEntry.linkedTaskId не найден в tasks: ' + e.linkedTaskId);
        }
      }

      /* Уникальность Journal.by_date (даже удалённые записи должны быть уникальны) */
      const dateSet = new Set();
      for (const j of data[STORE.JOURNAL]) {
        if (!isValidDateKey(j.date)) {
          throw new Error('Journal.date должен быть YYYY-MM-DD');
        }
        if (dateSet.has(j.date)) {
          throw new Error('Journal.date дубликат: ' + j.date);
        }
        dateSet.add(j.date);
      }

      return true;
    }

    /* ---- построение файла ---- */
    function buildBackupBlob(snapshot) {
      const json = JSON.stringify(snapshot, null, 2);
      return new Blob([json], { type: 'application/json' });
    }

    function buildBackupFilename(prefix) {
      const iso = nowIso().replace(/[:.]/g, '-');
      const base = prefix || 'nomi-backup';
      return base + '-' + iso + '.json';
    }

    async function downloadBackup(opts) {
      const o = opts || {};
      const snapshot = await dumpAll({ excludeAttachments: !!o.excludeAttachments });
      const blob = buildBackupBlob(snapshot);
      const filename = buildBackupFilename(o.filenamePrefix);
      triggerDownload(blob, filename);
      return { filename, snapshot };
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      try {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.rel = 'noopener';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          try { document.body.removeChild(a); } catch (_) { /* ignore */ }
          URL.revokeObjectURL(url);
        }, 0);
      } catch (e) {
        try { URL.revokeObjectURL(url); } catch (_) { /* ignore */ }
        throw toError(e, 'downloadBackup: не удалось инициировать скачивание');
      }
    }

    /* ---- importSnapshot ---- */
    async function importSnapshot(snapshot, opts) {
      const o = opts || {};
      validateSnapshot(snapshot);

      /* Восстанавливаем attachments: соберём Blob'ы, соответствующие dataUrl. */
      const attsBlobMap = new Map();
      for (const a of snapshot.attachments) {
        const meta = snapshot.data.attachments_meta.find((m) => m.id === a.id);
        if (!meta) throw new Error('attachments: метаданные отсутствуют для id=' + a.id);
        const blob = dataUrlToBlob(a.dataUrl, meta.mime || 'application/octet-stream');
        attsBlobMap.set(a.id, blob);
      }

      /* Полный набор записей, которые будем писать. */
      const records = {
        [STORE.TASKS]: snapshot.data[STORE.TASKS] || [],
        [STORE.PLANNER_ENTRIES]: snapshot.data[STORE.PLANNER_ENTRIES] || [],
        [STORE.PLANNER_NOTES]: snapshot.data[STORE.PLANNER_NOTES] || [],
        [STORE.EVENTS]: snapshot.data[STORE.EVENTS] || [],
        [STORE.JOURNAL]: snapshot.data[STORE.JOURNAL] || [],
        [STORE.IDEAS]: snapshot.data[STORE.IDEAS] || [],
        [STORE.BOOKS]: snapshot.data[STORE.BOOKS] || []
      };

      /* attachments целиком из attachments_meta + blobMap */
      const attRows = snapshot.data.attachments_meta.map((m) => {
        const row = Object.assign({}, m);
        row.blob = attsBlobMap.get(m.id) || null;
        if (!row.ownerKey && row.ownerType && row.ownerId) {
          row.ownerKey = attachmentOwnerKey(row.ownerType, row.ownerId);
        }
        return row;
      });
      records[STORE.ATTACHMENTS] = attRows;

      return withWriteLock(async () => {
        if (o.mode === 'replace') {
          /* Полная замена: очищаем все stores, пишем новые данные. */
          const allStores = STORE_NAMES.slice();
          const map = {};
          for (const s of allStores) map[s] = [];
          /* Заполняем только те, что есть в records */
          for (const k of Object.keys(records)) map[k] = records[k];
          map[STORE.SETTINGS] = snapshot.settings ? [snapshot.settings] : [];
          map[STORE.META] = snapshot.meta
            .filter((m) => m.key !== 'schemaVersion')
            .map((m) => ({ key: m.key, value: m.value }));
          if (map[STORE.SETTINGS].length) {
            map[STORE.SETTINGS] = [Object.assign({}, map[STORE.SETTINGS][0], { schemaVersion: DB_VERSION })];
          }
          /* Очистка + запись атомарно. Текущая версия схемы всегда последняя. */
          await storage.writeTx(allStores, async (tx, req) => {
            for (const s of allStores) await req(tx.objectStore(s).clear());
            for (const s of allStores) {
              const store = tx.objectStore(s);
              const rows = map[s] || [];
              for (const r of rows) await req(store.put(r));
            }
            await req(tx.objectStore(STORE.META).put({ key: 'schemaVersion', value: DB_VERSION }));
            return true;
          });
          return { mode: 'replace', counts: countRecords(records) };
        }

        /* Режим Add: конфликтующие записи не перезаписываются.
           conflictPolicy: skip | new. Журналы с занятой датой пропускаются всегда. */
        assert(o.conflictPolicy === 'skip' || o.conflictPolicy === 'new',
          'Для Add необходимо выбрать conflictPolicy: skip | new');

        const mergeStores = STORE_NAMES.slice();
        const current = await storage.readMany(mergeStores);
        const ids = {};
        const maps = {};
        for (const s of mergeStores) {
          ids[s] = new Set((current[s] || []).map((r) => r.id || r.key));
          maps[s] = new Map();
        }

        const currentJournalDates = new Set((current[STORE.JOURNAL] || []).map((r) => r.date));
        const skipOwner = { journal: new Set(), book: new Set() };
        const chosen = {};
        const skipped = {};

        const sourceByStore = {
          [STORE.TASKS]: records[STORE.TASKS],
          [STORE.PLANNER_ENTRIES]: records[STORE.PLANNER_ENTRIES],
          [STORE.PLANNER_NOTES]: records[STORE.PLANNER_NOTES],
          [STORE.EVENTS]: records[STORE.EVENTS],
          [STORE.JOURNAL]: records[STORE.JOURNAL],
          [STORE.IDEAS]: records[STORE.IDEAS],
          [STORE.BOOKS]: records[STORE.BOOKS],
          [STORE.ATTACHMENTS]: records[STORE.ATTACHMENTS]
        };

        /* Сначала определяем все ID и конфликты, чтобы затем правильно
           переписать внешние ключи и владельцев вложений. */
        const planningOrder = [
          STORE.TASKS, STORE.JOURNAL, STORE.BOOKS,
          STORE.PLANNER_ENTRIES, STORE.PLANNER_NOTES, STORE.EVENTS, STORE.IDEAS,
          STORE.ATTACHMENTS
        ];
        for (const s of planningOrder) {
          chosen[s] = [];
          skipped[s] = 0;
          for (const row of (sourceByStore[s] || [])) {
            const originalId = row.id;
            if (s === STORE.JOURNAL && currentJournalDates.has(row.date)) {
              maps[s].set(originalId, null);
              skipOwner.journal.add(originalId);
              skipped[s]++;
              continue;
            }
            if (ids[s].has(originalId)) {
              if (o.conflictPolicy === 'skip') {
                /* Связанные сущности Tasks остаются доступны по существующему ID. */
                maps[s].set(originalId,
                  s === STORE.TASKS ? originalId : null);
                if (s === STORE.JOURNAL) skipOwner.journal.add(originalId);
                if (s === STORE.BOOKS) skipOwner.book.add(originalId);
                skipped[s]++;
                continue;
              }
              const newId = uuid();
              maps[s].set(originalId, newId);
              ids[s].add(newId);
              chosen[s].push(Object.assign({}, row, { id: newId }));
            } else {
              maps[s].set(originalId, originalId);
              ids[s].add(originalId);
              chosen[s].push(Object.assign({}, row));
            }
          }
        }

        /* Вложения разрешены только если их владелец реально импортируется. */
        const sourceAttById = new Map(records[STORE.ATTACHMENTS].map((a) => [a.id, a]));
        const attachmentRows = [];
        const attachmentMap = maps[STORE.ATTACHMENTS];
        for (const a of chosen[STORE.ATTACHMENTS]) {
          const original = sourceAttById.get(
            Array.from(attachmentMap.entries()).find((entry) => entry[1] === a.id)?.[0] || a.id
          ) || a;
          const ownerStore = a.ownerType === 'journal' ? STORE.JOURNAL : STORE.BOOKS;
          const ownerMap = maps[ownerStore].get(a.ownerId);
          const ownerSkipped = (a.ownerType === 'journal' && skipOwner.journal.has(a.ownerId)) ||
                               (a.ownerType === 'book' && skipOwner.book.has(a.ownerId));
          if (!ownerMap || ownerSkipped) { skipped[STORE.ATTACHMENTS]++; continue; }
          const mappedId = a.id;
          const blob = attsBlobMap.get(original.id) || null;
          const next = Object.assign({}, a, {
            id: mappedId,
            ownerId: ownerMap,
            ownerKey: attachmentOwnerKey(a.ownerType, ownerMap),
            blob
          });
          attachmentRows.push(next);
        }

        const rowsToWrite = {};
        for (const s of mergeStores) rowsToWrite[s] = [];
        rowsToWrite[STORE.TASKS] = chosen[STORE.TASKS];
        rowsToWrite[STORE.JOURNAL] = chosen[STORE.JOURNAL];
        rowsToWrite[STORE.BOOKS] = chosen[STORE.BOOKS];
        rowsToWrite[STORE.PLANNER_ENTRIES] = chosen[STORE.PLANNER_ENTRIES].map((r) => {
          const mapped = maps[STORE.TASKS].get(r.linkedTaskId);
          return Object.assign({}, r, { linkedTaskId: r.linkedTaskId ? (mapped || null) : null });
        });
        rowsToWrite[STORE.PLANNER_NOTES] = chosen[STORE.PLANNER_NOTES];
        rowsToWrite[STORE.EVENTS] = chosen[STORE.EVENTS];
        rowsToWrite[STORE.IDEAS] = chosen[STORE.IDEAS];
        rowsToWrite[STORE.ATTACHMENTS] = attachmentRows;

        /* Книги связываются с импортированными обложками только после построения
           attachment ID map. Если вложение пропущено — книга остаётся без обложки. */
        const importedAttachmentIds = new Set(attachmentRows.map((a) => a.id));
        const importedAttachmentMap = new Map();
        for (const [oldId, newId] of attachmentMap.entries()) {
          if (newId && importedAttachmentIds.has(newId)) importedAttachmentMap.set(oldId, newId);
        }
        rowsToWrite[STORE.BOOKS] = rowsToWrite[STORE.BOOKS].map((book) => {
          const sourceBook = records[STORE.BOOKS].find((b) => b.id === Array.from(maps[STORE.BOOKS].entries()).find((e) => e[1] === book.id)?.[0]);
          const oldCover = sourceBook ? sourceBook.coverAttachmentId : book.coverAttachmentId;
          return Object.assign({}, book, {
            coverAttachmentId: oldCover ? (importedAttachmentMap.get(oldCover) || null) : null
          });
        });

        /* PlannerEntry linked to a task that was skipped due a task ID conflict
           can retain the existing task link only if the task itself still exists. */
        const existingTaskIds = new Set((current[STORE.TASKS] || []).map((t) => t.id));
        rowsToWrite[STORE.PLANNER_ENTRIES] = rowsToWrite[STORE.PLANNER_ENTRIES].map((entry) => {
          if (!entry.linkedTaskId || existingTaskIds.has(entry.linkedTaskId) ||
              rowsToWrite[STORE.TASKS].some((t) => t.id === entry.linkedTaskId)) return entry;
          return Object.assign({}, entry, { linkedTaskId: null });
        });

        /* Merge не перезаписывает settings и существующие meta. */
        const existingMetaKeys = new Set((current[STORE.META] || []).map((m) => m.key));
        rowsToWrite[STORE.META] = snapshot.meta
          .filter((m) => m.key !== 'schemaVersion' && !existingMetaKeys.has(m.key))
          .map((m) => ({ key: m.key, value: m.value }));

        await storage.writeTx(mergeStores, async (tx, req) => {
          for (const s of mergeStores) {
            const store = tx.objectStore(s);
            for (const r of rowsToWrite[s] || []) await req(store.put(r));
          }
          return true;
        });

        const counts = countRecords(rowsToWrite);
        return { mode: 'merge', conflictPolicy: o.conflictPolicy, counts, skipped };

      });
    }

    function countRecords(records) {
      const out = {};
      for (const k of Object.keys(records)) out[k] = records[k].length;
      return out;
    }

    /* Прочитать фактическую schemaVersion из meta (с fallback на settings/schemaVersion). */
    async function getActualSchemaVersion(storageRef) {
      const fromMeta = await storageRef.getMeta('schemaVersion');
      if (Number.isInteger(fromMeta) && fromMeta >= 1) return fromMeta;
      const settings = await storageRef.getSettings();
      if (settings && Number.isInteger(settings.schemaVersion) && settings.schemaVersion >= 1) {
        return settings.schemaVersion;
      }
      return DB_VERSION;
    }

    return {
      dumpAll,
      validateSnapshot,
      validateSnapshotStructure,
      buildBackupBlob,
      buildBackupFilename,
      downloadBackup,
      triggerDownload,
      importSnapshot,
      blobToDataUrl,
      dataUrlToBlob,
      getActualSchemaVersion
    };
  }

  NOMI.blobToDataUrl = blobToDataUrl;
  NOMI.dataUrlToBlob = dataUrlToBlob;
  NOMI.createExportImport = createExportImport;

  NomiData.ExportImport = createExportImport;
  /* ---------------------------------------------------------------
     probeOpen(): определить существование базы и фактическую версию
     без автоматического повышения версии.

     Приоритет: indexedDB.databases(), если доступен.
     Fallback: indexedDB.open('nomi-db') без указания версии, с
     открытием и немедленным abort. Отсутствие базы признаём только
     при abortedByUs === true && error.name === 'AbortError'.
     --------------------------------------------------------------- */
  async function probeOpen() {
    /* 1. Быстрый путь: indexedDB.databases() */
    if (typeof indexedDB !== 'undefined' && typeof indexedDB.databases === 'function') {
      try {
        const dbs = await indexedDB.databases();
        if (Array.isArray(dbs)) {
          const found = dbs.find((d) => d && d.name === DB_NAME);
          if (!found) {
            return { exists: false, version: 0 };
          }
          /* Safari иногда возвращает version === undefined — тогда fallback. */
          if (typeof found.version === 'number' && found.version >= 1) {
            return { exists: true, version: found.version };
          }
        }
      } catch (_) {
        /* Игнорируем и пробуем fallback */
      }
    }

    /* 2. Fallback: открытие без версии. */
    return new Promise((resolve, reject) => {
      let abortedByUs = false;
      let settled = false;
      let req;
      try {
        req = indexedDB.open(DB_NAME);
      } catch (e) {
        reject(toError(e, 'probeOpen: не удалось вызвать indexedDB.open'));
        return;
      }
      req.onupgradeneeded = () => {
        /* Если БД не существовала, открытие без версии создаст её с
           version=1. Нам это не нужно: ставим флаг, откатываем. */
        abortedByUs = true;
        try { req.transaction.abort(); } catch (_) { /* ignore */ }
      };
      req.onsuccess = () => {
        if (settled) return;
        settled = true;
        const db = req.result;
        const v = db.version;
        try { db.close(); } catch (_) { /* ignore */ }
        /* Если onupgradeneeded не сработал, база существовала. */
        resolve({ exists: true, version: v });
      };
      req.onerror = (event) => {
        if (settled) return;
        const err = req.error;
        if (abortedByUs && err && err.name === 'AbortError') {
          settled = true;
          event.preventDefault && event.preventDefault();
          resolve({ exists: false, version: 0 });
          return;
        }
        settled = true;
        reject(err || new Error('probeOpen: ошибка открытия'));
      };
      req.onblocked = () => {
        /* Ничего не делаем: не считаем blocked признаком чего-либо. */
      };
    });
  }

  /* ---------------------------------------------------------------
     BroadcastChannel (опционально)
     --------------------------------------------------------------- */
  function createBroadcaster() {
    if (typeof BroadcastChannel === 'undefined') {
      return {
        supported: false,
        post() { /* no-op */ },
        close() { /* no-op */ }
      };
    }
    let ch;
    try { ch = new BroadcastChannel(BROADCAST_CHANNEL); }
    catch (_) {
      return { supported: false, post() {}, close() {} };
    }
    return {
      supported: true,
      post(type, payload) {
        try { ch.postMessage({ type: type, payload: payload || null, at: nowIso() }); }
        catch (_) { /* ignore */ }
      },
      close() {
        try { ch.close(); } catch (_) { /* ignore */ }
      },
      _channel: ch
    };
  }

  /* ---------------------------------------------------------------
     navigator.storage.persist() — один запрос при первом запуске.
     Без навязчивых модальных окон.
     --------------------------------------------------------------- */
  async function requestPersistentStorage() {
    if (typeof navigator === 'undefined' ||
        !navigator.storage ||
        typeof navigator.storage.persist !== 'function') {
      return { supported: false, granted: false };
    }
    try {
      const granted = await navigator.storage.persist();
      return { supported: true, granted: !!granted };
    } catch (_) {
      return { supported: true, granted: false, error: true };
    }
  }

  /* ---------------------------------------------------------------
     Сообщения пользователю
     --------------------------------------------------------------- */
  const STATUS_MESSAGES = Object.freeze({
    futureVersion:
      'База данных создана более новой версией NOMI. Repository не запущен. ' +
      'Обновите приложение — работа со старыми данными заблокирована.',
    locksUnavailableOldDb:
      'Браузер не поддерживает безопасное обновление базы. Данные сохранены. ' +
      'Используйте браузер с поддержкой Web Locks.',
    migrationBlocked:
      'Обновление базы ожидает закрытия других вкладок NOMI. Пожалуйста, закройте их.',
    migrationInProgress:
      'База обновляется. Пожалуйста, обновите страницу после завершения.',
    migrationDeclined:
      'Миграция отменена пользователем. Изменения не применены.',
    versionMismatchAfterMigration:
      'Состояние базы изменилось во время миграции. Требуется перезапуск.',
    openFailed:
      'Не удалось открыть локальную базу данных.'
  });

  function emitStatus(kind, message, extra) {
    const payload = {
      kind: kind,
      message: message,
      at: nowIso(),
      extra: extra || null
    };
    const handler = NomiData.onStatus;
    if (typeof handler === 'function') {
      try { handler(payload); } catch (_) { /* ignore */ }
    }
    /* Мягкий fallback: не шумим в консоль для обычных статусов. */
    if (kind === 'error' || kind === 'fatal') {
      try { console.warn('[NomiData]', kind, message, extra || ''); } catch (_) { /* ignore */ }
    }
  }

  function emitError(err, kind) {
    const e = toError(err, 'NomiData error');
    const handler = NomiData.onError;
    const payload = { kind: kind || 'error', error: e, message: e.message, at: nowIso() };
    if (typeof handler === 'function') {
      try { handler(payload); } catch (_) { /* ignore */ }
    }
    try { console.error('[NomiData]', e); } catch (_) { /* ignore */ }
    return e;
  }

  /* ---------------------------------------------------------------
     Пользовательский диалог подтверждения миграции.
     Через NomiData.confirmMigration (может быть подменён приложением).
     Дефолт — window.confirm.
     --------------------------------------------------------------- */
  async function askConfirmMigration(info) {
    const handler = NomiData.confirmMigration;
    if (typeof handler === 'function') {
      try {
        const res = await handler(info);
        return !!res;
      } catch (_) {
        return false;
      }
    }
    if (typeof window !== 'undefined' && typeof window.confirm === 'function') {
      try {
        return !!window.confirm(info && info.message
          ? info.message
          : 'Перед обновлением локальной базы будет скачан резервный файл. Продолжить?');
      } catch (_) {
        return false;
      }
    }
    return false;
  }

  /* ---------------------------------------------------------------
     bootstrap(): безопасный запуск Data Layer.

     Порядок:
       1. probeOpen() — узнать фактическую версию.
       2. Решить сценарий:
          — version > DB_VERSION → ошибка future, Repository не запускать.
          — version === DB_VERSION → обычный запуск.
          — version < DB_VERSION (или база отсутствует):
            * если Web Locks недоступны и version > 0 → блокировать;
            * иначе — миграция под exclusive локом.
       3. При миграции: dumpAll старого состояния → backup-файл →
          подтверждение → повторная проверка версии под exclusive локом →
          close старого соединения → открытие новой версии через
          onupgradeneeded (Migrations.upgrade) → emit migration:done.
       4. Обычный запуск: Storage.openAtVersion(DB_VERSION) → Settings.ensure().
       5. Регистрация window.NomiData.repo/Storage/Settings/ExportImport,
          broadcast migration:done.
     --------------------------------------------------------------- */
  async function bootstrap(options) {
    const o = options || {};
    if (NomiData._bootPromise) return NomiData._bootPromise;

    NomiData._bootPromise = (async () => {
      /* Внутренний storage всегда создаётся, но не открывается до решения сценария. */
      const storage = new Storage();
      NomiData._storage = storage;

      /* 1. probeOpen */
      let probe;
      try {
        probe = await probeOpen();
      } catch (e) {
        emitError(e, 'probe');
        emitStatus('fatal', STATUS_MESSAGES.openFailed, { error: String(e) });
        throw e;
      }

      const actualVersion = probe.exists ? probe.version : 0;

      /* Обработчик versionchange для всех соединений — глобально. */
      storage.onVersionChange = () => {
        NomiData.isReady = false;
        NomiData.repo = null;
        NomiData.storage = null;
        NomiData._bootPromise = null;
        emitStatus('info', STATUS_MESSAGES.migrationInProgress);
      };

      /* 2. future version */
      if (actualVersion > DB_VERSION) {
        emitStatus('fatal', STATUS_MESSAGES.futureVersion, { actualVersion: actualVersion, supported: DB_VERSION });
        throw new Error('NOMI: база данных более новой версии (' + actualVersion + ' > ' + DB_VERSION + ')');
      }

      const broadcaster = createBroadcaster();
      NomiData._broadcaster = broadcaster;

      /* 3. Сценарий: обычный запуск без апгрейда */
      if (actualVersion === DB_VERSION) {
        await storage.openAtVersion(DB_VERSION, Migrations, {});
        const settings = createSettings(storage);
        await settings.ensure();
        finalizeBoot(storage, settings, broadcaster, { mode: 'ready', version: actualVersion });
        return NomiData;
      }

      /* 4. База отсутствует или старая версия — нужен апгрейд/создание */
      const needUpgrade = actualVersion > 0 && actualVersion < DB_VERSION;
      const isFreshCreate = actualVersion === 0;

      if (needUpgrade && !locksAvailable()) {
        /* Web Locks недоступны, база старая — запрещаем автоматическую миграцию. */
        emitStatus('fatal', STATUS_MESSAGES.locksUnavailableOldDb, { actualVersion: actualVersion });
        throw new Error('NOMI: невозможно безопасно мигрировать без Web Locks');
      }

      if (!needUpgrade && !isFreshCreate) {
        /* Никаких других случаев быть не может, но на всякий случай. */
        throw new Error('NOMI: неопределённое состояние базы (' + actualVersion + ')');
      }

      /* Для совершенно новой базы подтверждение и backup не требуются. */
      if (isFreshCreate) {
        await storage.openAtVersion(DB_VERSION, Migrations, {});
        const settings = createSettings(storage);
        await settings.ensure();
        try { await requestPersistentStorage(); } catch (_) { /* ignore */ }
        finalizeBoot(storage, settings, broadcaster, { mode: 'fresh', version: DB_VERSION });
        return NomiData;
      }

      /* --- needUpgrade --- */

      /* Всё дальнейшее — под exclusive локом. */
      const performMigration = async () => {
        /* 4.1. Повторная проверка версии под exclusive локом. */
        const reprobe = await probeOpen();
        if (!reprobe.exists) {
          /* Кто-то удалил базу между этапами — создаём свежую. */
          await storage.openAtVersion(DB_VERSION, Migrations, {});
          const settings = createSettings(storage);
          await settings.ensure();
          finalizeBoot(storage, settings, broadcaster, { mode: 'fresh-after-loss', version: DB_VERSION });
          return NomiData;
        }
        if (reprobe.version > DB_VERSION) {
          emitStatus('fatal', STATUS_MESSAGES.futureVersion, {
            actualVersion: reprobe.version, supported: DB_VERSION
          });
          throw new Error('NOMI: база данных более новой версии после повторной проверки');
        }
        if (reprobe.version === DB_VERSION) {
          /* Другая вкладка уже выполнила миграцию. */
          await storage.openAtVersion(DB_VERSION, Migrations, {});
          const settings = createSettings(storage);
          await settings.ensure();
          finalizeBoot(storage, settings, broadcaster, { mode: 'ready-after-other', version: DB_VERSION });
          return NomiData;
        }
        /* reprobe.version < DB_VERSION — продолжаем миграцию, но на свежих данных. */
        const oldVersion = reprobe.version;

        /* 4.2. Открыть старую базу, получить snapshot. */
        const oldStorage = new Storage();
        await oldStorage.openAtVersion(oldVersion, null, {
          onUpgradeNeeded: () => { /* никогда не вызывается: oldVersion совпадает */ }
        });

        /* 4.3. dumpAll старого состояния. */
        const oldRepo = NOMI.createRepo(oldStorage);
        const oldEI = createExportImport(oldStorage, oldRepo);
        let snapshot;
        try {
          snapshot = await oldEI.dumpAll({ excludeAttachments: false });
        } catch (e) {
          try { oldStorage.close(); } catch (_) { /* ignore */ }
          emitError(e, 'dumpAll');
          throw e;
        }

        /* 4.4. Валидация снимка. */
        try {
          oldEI.validateSnapshot(snapshot);
        } catch (e) {
          try { oldStorage.close(); } catch (_) { /* ignore */ }
          emitError(e, 'validateSnapshot');
          throw e;
        }

        /* 4.5. Создать backup и скачать. */
        let backupInfo = null;
        try {
          const blob = oldEI.buildBackupBlob(snapshot);
          const filename = oldEI.buildBackupFilename('nomi-pre-migration');
          oldEI.triggerDownload(blob, filename);
          backupInfo = { filename: filename };
        } catch (e) {
          try { oldStorage.close(); } catch (_) { /* ignore */ }
          emitError(e, 'backup');
          throw e;
        }

        /* 4.6. Подтверждение пользователя. */
        const confirmed = await askConfirmMigration({
          fromVersion: oldVersion,
          toVersion: DB_VERSION,
          backupFilename: backupInfo && backupInfo.filename,
          message:
            'Перед обновлением локальной базы будет скачан резервный файл (' +
            (backupInfo && backupInfo.filename) +
            '). Продолжить обновление?'
        });
        if (!confirmed) {
          try { oldStorage.close(); } catch (_) { /* ignore */ }
          emitStatus('info', STATUS_MESSAGES.migrationDeclined);
          throw new Error('NOMI: миграция отменена пользователем');
        }

        /* 4.7. Закрыть старое соединение. */
        try { oldStorage.close(); } catch (_) { /* ignore */ }

        /* 4.8. Открыть новую версию с onupgradeneeded → Migrations.upgrade. */
        broadcaster.post('migration:start', { from: oldVersion, to: DB_VERSION });
        await storage.openAtVersion(DB_VERSION, Migrations, {
          onBlocked: () => {
            emitStatus('info', STATUS_MESSAGES.migrationBlocked);
          }
        });

        /* 4.9. Settings.ensure() — гарантировать наличие settings в новой схеме. */
        const settings = createSettings(storage);
        await settings.ensure();

        broadcaster.post('migration:done', { from: oldVersion, to: DB_VERSION });

        /* 4.10. Запросить persistent storage. */
        try { await requestPersistentStorage(); } catch (_) { /* ignore */ }

        finalizeBoot(storage, settings, broadcaster, { mode: 'migrated', from: oldVersion, to: DB_VERSION });
        return NomiData;
      };

      if (locksAvailable()) {
        /* Exclusive lock на время всей миграции. */
        await navigator.locks.request(
          WRITE_LOCK_NAME,
          { mode: 'exclusive' },
          () => performMigration()
        );
      } else {
        /* Дошли сюда только если needUpgrade, но выше уже отсекли этот случай.
           Оставляем защиту. */
        throw new Error('NOMI: невозможно безопасно мигрировать без Web Locks');
      }

      return NomiData;
    })().catch((e) => {
      NomiData._bootPromise = null;
      try { if (NomiData._storage) NomiData._storage.close(); } catch (_) { /* ignore */ }
      NomiData._storage = null;
      NomiData.isReady = false;
      NomiData.repo = null;
      NomiData.storage = null;
      emitError(e, 'boot');
      throw e;
    });

    return NomiData._bootPromise;
  }

  /* Финализировать публичный API после успешного запуска storage. */
  function finalizeBoot(storage, settings, broadcaster, info) {
    const repo = NOMI.createRepo(storage);
    const exportImport = createExportImport(storage, repo);

    NomiData.Storage = Storage;
    NomiData.Repo = repo;
    NomiData.Settings = settings;
    NomiData.Migrations = Migrations;
    NomiData.ExportImport = exportImport;
    NomiData.repo = repo;
    NomiData.storage = storage;
    NomiData.bootInfo = info;
    NomiData.isReady = true;

    emitStatus('info', 'NomiData готов', info);
  }

  /* Публичный boot() */
  NomiData.boot = function boot(options) {
    return bootstrap(options || {});
  };

  /* Ручное закрытие для тестов / выхода */
  NomiData.close = function close() {
    try {
      if (NomiData._broadcaster && typeof NomiData._broadcaster.close === 'function') {
        NomiData._broadcaster.close();
      }
    } catch (_) { /* ignore */ }
    if (NomiData._storage) {
      try { NomiData._storage.close(); } catch (_) { /* ignore */ }
    }
    NomiData.repo = null;
    NomiData.storage = null;
    NomiData.isReady = false;
    NomiData._bootPromise = null;
  };

  /* Вспомогательные утилиты, доступные публично */
  NomiData.probeOpen = probeOpen;
  NomiData.requestPersistentStorage = requestPersistentStorage;
  NomiData.STATUS_MESSAGES = STATUS_MESSAGES;

  /* Внутренние утилиты для отладки / тестов — не документированы как API */
  NOMI.probeOpen = probeOpen;
  NOMI.createBroadcaster = createBroadcaster;
  NOMI.requestPersistentStorage = requestPersistentStorage;
  NOMI.createExportImport = createExportImport;
  NOMI.bootstrap = bootstrap;
  NOMI.finalizeBoot = finalizeBoot;

  /* НЕ вызываем bootstrap() автоматически: этап 6.2 — изолированный Data Layer.
     Интеграция страниц будет выполнена отдельным этапом, где вызов
     window.NomiData.boot() станет частью инициализации приложения. */

})(window);

</script>

  function startOfWeek(d) {const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(12,0,0,0);return x;}
  function eventItems(data) {
    return [...data.tasks.filter(t=>t.dueDate).map(t=>({...t,_type:'task',_date:t.dueDate,_time:t.dueTime})),
      ...data.events.map(e=>({...e,_type:'event',_date:e.date,_time:e.time})),
      ...data.plannerEntries.filter(e=>!e.linkedTaskId).map(e=>({...e,_type:'entry',_date:e.date,_time:e.time}))];
  }
  function dayItems(items,key) {return items.filter(x=>x._date===key).sort((a,b)=>(a._time||'99:99').localeCompare(b._time||'99:99'));}
  function calendarChip(item) {
    return `<span class="calendar-chip-wrap"><button class="calendar-chip ${item._type==='task'?'task-chip':'event-chip'} ${item._type==='event'?esc(item.accent||'lavender'):''}" data-action="${item._type==='task'?'edit-task':item._type==='event'?'edit-event':'edit-planner-entry'}" data-id="${item.id}">${item._time?esc(item._time)+' · ':''}${esc(item.title)}</button>${item._type==='event'?iconBtn('delete-event',item.id):item._type==='entry'?iconBtn('delete-planner-entry',item.id):''}</span>`;
  }
  async function renderCalendar() {
    const c=$('#planner-calendar-view');if(!c)return;const d=await loadData();const items=eventItems(d);const cursor=new Date(state.calendarDate);const key=dateKey(cursor);
    const title=cursor.toLocaleDateString(state.language==='ru'?'ru-RU':'en-GB',{month:'long',year:'numeric'});
    let body='';
    if(state.calendarView==='day') {
      const list=dayItems(items,key);
      body=`<div class="calendar-day-view"><h3>${esc(fmtDate(key))}</h3>${list.length?list.map(calendarChip).join(''):emptyState(t('noData'),t('noSchedule'))}</div>`;
    } else if(state.calendarView==='week') {
      const start=startOfWeek(cursor);body=`<div class="calendar-week-grid">${Array.from({length:7},(_,i)=>{const dt=addDays(start,i),k=dateKey(dt),rows=dayItems(items,k);return `<div class="calendar-week-col ${k===dateKey()?'is-today':''}"><button class="calendar-day-link" data-action="calendar-select-day" data-date="${k}"><small>${dt.toLocaleDateString(state.language==='ru'?'ru-RU':'en-GB',{weekday:'short'})}</small><b>${dt.getDate()}</b></button>${rows.map(calendarChip).join('')}</div>`;}).join('')}</div>`;
    } else if(state.calendarView==='month') {
      const first=new Date(cursor.getFullYear(),cursor.getMonth(),1,12);const offset=(first.getDay()+6)%7;const start=addDays(first,-offset);const names=state.language==='ru'?['Пн','Вт','Ср','Чт','Пт','Сб','Вс']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      body=`<div class="calendar-grid"><div class="calendar-weekdays">${names.map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-month-grid">${Array.from({length:42},(_,i)=>{const dt=addDays(start,i),k=dateKey(dt),rows=dayItems(items,k);return `<div class="calendar-cell ${dt.getMonth()!==cursor.getMonth()?'muted':''} ${k===dateKey()?'is-today':''} ${k===key?'is-selected':''}"><button class="calendar-day-link" data-action="calendar-select-day" data-date="${k}">${dt.getDate()}</button><div class="calendar-cell-events">${rows.slice(0,3).map(calendarChip).join('')}${rows.length>3?`<small>+${rows.length-3}</small>`:''}</div></div>`;}).join('')}</div></div>`;
    } else {
      body=`<div class="calendar-year-grid">${Array.from({length:12},(_,m)=>{const first=new Date(cursor.getFullYear(),m,1,12);const days=new Date(cursor.getFullYear(),m+1,0).getDate();return `<div class="calendar-mini-month"><h4>${first.toLocaleDateString(state.language==='ru'?'ru-RU':'en-GB',{month:'long'})}</h4><div>${Array.from({length:days},(_,i)=>{const dt=new Date(cursor.getFullYear(),m,i+1,12),k=dateKey(dt),n=dayItems(items,k).length;return `<button class="${n?'has-items':''} ${k===dateKey()?'is-today':''}" data-action="calendar-select-day" data-date="${k}" title="${esc(fmtDate(k))}">${i+1}</button>`;}).join('')}</div></div>`;}).join('')}</div>`;
    }
    c.innerHTML=`<div class="page-toolbar calendar-toolbar"><div class="calendar-title"><button class="icon-btn" data-action="calendar-prev" aria-label="${t('previous')}">‹</button><h3>${esc(title)}</h3><button class="icon-btn" data-action="calendar-next" aria-label="${t('next')}">›</button><button class="btn-quiet" data-action="calendar-today">${t('today')}</button></div></div>${body}`;
  }

  async function saveJournal() {
    const form=$('#journalForm');const data=new FormData(form);const body=String(data.get('body')||'');
    const prompts=[data.get('prompt0'),data.get('prompt1'),data.get('prompt2')].map(x=>String(x||'').trim());
    const mood=String(data.get('mood')||'')||null;
    const tags=String(data.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean);
    const existing=await NomiData.repo.journal.getByDate(state.journalDate);
    if(!body.trim()&&!prompts.some(Boolean)&&!mood&&!tags.length&&!existing) {toast(t('noJournal'));return;}
    const entry=await NomiData.repo.journal.upsertByDate({date:state.journalDate,body,prompts,mood,tags});
    toast(t('saved'));await renderJournal();
  }
  async function addJournalFiles(files) {
    let entry=await NomiData.repo.journal.getByDate(state.journalDate);
    if(!entry) entry=await NomiData.repo.journal.upsertByDate({date:state.journalDate,body:'',prompts:[],mood:null});
    for(const file of files) {
      if(!file.type.startsWith('image/'))continue;
      if(file.size>12*1024*1024){toast(state.language==='ru'?'Максимальный размер изображения — 12 МБ':'Image size limit: 12 MB');continue;}
      await NomiData.repo.attachments.create({ownerType:'journal',ownerId:entry.id,mime:file.type,bytes:file.size,blob:file});
    }
    await renderJournal();toast(t('saved'));
  }

  function addBookModal(book=null) {
    openModal({title:book?t('edit')+' · '+t('book'):t('addBook'),values:book||{status:'planned'},fields:[
      {name:'title',label:t('title'),required:true},{name:'author',label:t('author')},
      {name:'status',label:t('status'),type:'select',options:['planned','reading','finished','abandoned'].map(x=>({value:x,label:t(x)}))},
      {name:'coverFile',label:t('cover'),type:'file',accept:'image/*',help:'Image up to 12 MB'}
    ],onSave:async v=>{
      if(!v.title.trim())throw new Error(t('enterTitle'));
      if(v.coverFile&&(!v.coverFile.type.startsWith('image/')||v.coverFile.size>12*1024*1024))throw new Error(state.language==='ru'?'Изображение должно быть меньше 12 МБ':'Image must be under 12 MB');
      let createdNew=false;
      let saved=book?await NomiData.repo.books.update(book.id,{title:v.title,author:v.author,status:v.status}):(createdNew=true,await NomiData.repo.books.create({title:v.title,author:v.author,status:v.status,rating:null,coverAttachmentId:null}));
      if(v.coverFile){
        const oldId=saved.coverAttachmentId;
        let att=null;
        try{
          att=await NomiData.repo.attachments.create({ownerType:'book',ownerId:saved.id,mime:v.coverFile.type,bytes:v.coverFile.size,blob:v.coverFile});
          saved=await NomiData.repo.books.update(saved.id,{coverAttachmentId:att.id});
        }catch(err){
          if(att){try{await NomiData.repo.attachments.softDelete(att.id);}catch(cleanErr){console.error('Attachment rollback failed',cleanErr);toast((state.language==='ru'?'Не удалось очистить вложение: ':'Cover cleanup failed: ')+cleanErr.message);}}
          if(createdNew){try{await NomiData.repo.books.softDelete(saved.id);}catch(cleanBookErr){console.error('Book rollback failed',cleanBookErr);}}
          throw err;
        }
        if(oldId){
          try{await NomiData.repo.attachments.softDelete(oldId);}
          catch(cleanOldErr){console.warn('Old cover cleanup failed',cleanOldErr);toast(state.language==='ru'?'Новая обложка сохранена, но старую не удалось очистить.':'New cover saved, but the old cover could not be cleaned up.');}
        }
      }
      await refreshAllVisible();toast(t('saved'));
    }});
  }

  const HABIT_KEY='nomi.habits.v1';
  function readHabits(){try{return JSON.parse(localStorage.getItem(HABIT_KEY)||'[]')}catch(_){return[]}}
  function writeHabits(rows){localStorage.setItem(HABIT_KEY,JSON.stringify(rows));}

  function addHabitQuick(){const name=prompt('Название привычки');if(!name?.trim())return;const choice=(prompt('График: 1 — каждый день; 2 — по будням; 3 — три раза в неделю; 4 — гибкий график','1')||'1').trim();const frequency=({'1':'daily','2':'weekdays','3':'three','4':'flexible'})[choice]||'daily';let days=frequency==='weekdays'?[1,2,3,4,5]:frequency==='three'?[1,3,5]:[0,1,2,3,4,5,6];if(frequency==='flexible'){const raw=prompt('Дни недели через запятую: 0 — вс, 1 — пн, … 6 — сб','1,3,5');if(raw?.trim()){const chosen=raw.split(',').map(x=>Number(x.trim())).filter(x=>Number.isInteger(x)&&x>=0&&x<=6);if(chosen.length)days=[...new Set(chosen)];}}const rows=readHabits();rows.push({id:newNomiId(),name:name.trim(),frequency,days,completed:[],createdAt:dateKey()});writeHabits(rows);renderHabits().catch(console.error);}

  async function migratePlannerNotesToIdeas(){
    const marker='nomi.plannerNotesMigrated.v1';if(localStorage.getItem(marker)==='done')return;
    const source=await NomiData.repo.plannerNotes.listAll();const active=source.filter(n=>!n.deletedAt);if(!active.length){for(const n of source)await NomiData.repo.plannerNotes.purge(n.id);localStorage.setItem('nomi.plannerNotesMigrationResult.v1',JSON.stringify({before:0,migrated:0,after:0,verified:true,at:new Date().toISOString()}));localStorage.setItem(marker,'done');return;}
    const before=active.length;localStorage.setItem('nomi.plannerNotesMigrationBackup.v1',JSON.stringify(active));let migrated=0;
    for(const n of active){const id='planner-note-'+n.id;const exists=await NomiData.repo.ideas.get(id);if(exists&&!exists.deletedAt){migrated++;continue;}if(exists&&exists.deletedAt)await NomiData.repo.ideas.purge(id);const date=n.date||n.createdAt?.slice(0,10)||dateKey();const body=`Дата заметки: ${date}${n.important?' · Важное':''}\n\n${n.text||''}`;await NomiData.repo.ideas.create({id,kind:'note',title:(n.title||'Заметка').trim()||'Заметка',description:body,color:n.important?'berry':'paper',createdAt:n.createdAt||`${date}T12:00:00.000Z`});migrated++;}
    const ideas=await NomiData.repo.ideas.listAll();const verified=active.every(n=>ideas.some(i=>i.id==='planner-note-'+n.id));
    if(!verified||migrated!==before)throw new Error('Миграция заметок Planner не прошла проверку количества. Исходные заметки сохранены.');
    for(const n of source)await NomiData.repo.plannerNotes.purge(n.id);
    const remaining=(await NomiData.repo.plannerNotes.listAll()).length;if(remaining!==0)throw new Error('Заметки перенесены, но старые записи не удалось полностью очистить.');
    localStorage.setItem('nomi.plannerNotesMigrationResult.v1',JSON.stringify({before,migrated,after:remaining,verified:true,at:new Date().toISOString()}));localStorage.setItem(marker,'done');console.info(`NOMI migration planner_notes → Ideas: ${before}/${migrated} verified`);
  }
