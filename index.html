<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta content="#F8F5F0" name="theme-color"/>
<link href="./manifest.webmanifest" rel="manifest"/>
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"/>
<link rel="apple-touch-icon" href="./icons/icon-192.png"/>
<title>NOMI — Personal Life OS</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500;1,600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --berry:#C92F61;
    --cherry:#8F3155;
    --lavender:#A88AE8;
    --lilac:#E7DDF5;
    --blush:#F0DCE5;
    --paper:#F8F5F0;
    --grey:#E7E8EC;
    --mint:#BBD9CF;
    --lemon:#E9DE83;
    --ink:#292631;

    --font-display:'Golos Text',system-ui,sans-serif;
    --font-serif:'Cormorant Garamond',Georgia,serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',monospace;

    --sidebar-w:238px;
    --sidebar-w-collapsed:66px;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-display);background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(circle at 12% 8%,rgba(231,221,245,.55),transparent 42%),
                     radial-gradient(circle at 92% 96%,rgba(240,220,229,.5),transparent 46%);
    background-attachment:fixed;
  }
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--berry);color:#fff}

  .app{display:flex;min-height:100vh}

  /* ============ SIDEBAR ============ */
  .sidebar{
    width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
    padding:24px 14px;display:flex;flex-direction:column;gap:2px;
    border-right:1px solid rgba(41,38,49,.1);
    background:rgba(248,245,240,.86);backdrop-filter:blur(14px);
    position:sticky;top:0;height:100vh;overflow:hidden;
    transition:width .28s cubic-bezier(.4,0,.2,1), flex-basis .28s cubic-bezier(.4,0,.2,1);
    z-index:40;
  }
  .app.collapsed .sidebar{width:var(--sidebar-w-collapsed);flex-basis:var(--sidebar-w-collapsed)}

  .brand{padding:2px 10px 24px;position:relative}
  .brand-word{
    font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:-.06em;line-height:1;
  }
  .brand-word span{color:var(--berry)}
  .brand-sub{
    font-family:var(--font-mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--cherry);margin-top:8px;opacity:.75;
  }
  .brand::after{
    content:'';position:absolute;top:4px;right:12px;width:9px;height:9px;
    background:var(--lavender);border-radius:50%;box-shadow:0 0 0 3px rgba(168,138,232,.2);
  }
  .brand::before{
    content:'';position:absolute;top:20px;right:26px;width:5px;height:5px;
    background:var(--berry);border-radius:50%;
  }
  .app.collapsed .brand-word,.app.collapsed .brand-sub,.app.collapsed .brand::after,.app.collapsed .brand::before{display:none}

  .nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border:0;border-radius:10px;
    background:transparent;color:#5d5766;text-align:left;width:100%;
    font-size:13px;font-weight:600;
    transition:color .15s,background .15s,transform .15s;
    position:relative;
  }
  .nav-item:hover{color:var(--ink);background:var(--lilac)}
  .nav-item.active{color:var(--ink);background:var(--blush)}
  .nav-item.active::before{
    content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:20px;background:var(--berry);border-radius:0 3px 3px 0;
  }
  .nav-ico{width:19px;height:19px;flex:0 0 19px;display:grid;place-items:center;font-size:12px;color:var(--cherry)}
  .nav-item.active .nav-ico{color:var(--berry)}
  .app.collapsed .nav-item span:not(.nav-ico){display:none}
  .app.collapsed .nav-item{justify-content:center;padding:12px 0}
  .app.collapsed .nav-item.active::before{display:none}
  .app.collapsed .nav-item.active{background:var(--berry);color:#fff}
  .app.collapsed .nav-item.active .nav-ico{color:#fff}

  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(41,38,49,.1)}
  .issue-meta{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8a8295;padding:6px 10px;line-height:1.8}
  .issue-meta b{color:var(--ink)}
  .sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mint);margin-right:5px;vertical-align:middle;box-shadow:0 0 0 2px rgba(187,217,207,.35)}
  .app.collapsed .issue-meta{display:none}

  /* ============ CANVAS ============ */
  .canvas{flex:1;min-width:0;padding:26px 40px 90px;max-width:1480px;margin:0 auto}

  /* MASTHEAD */
  .masthead{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:32px;flex-wrap:wrap;
  }
  .masthead-left{display:flex;align-items:baseline;gap:14px}
  .masthead-word{font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:-.05em}
  .masthead-word span{color:var(--berry)}
  .masthead-meta{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#8a8295}
  .masthead-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .clock-big{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--ink);padding:6px 11px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transition:background .15s,color .15s}
  .seg button.active{background:var(--ink);color:var(--paper)}
  .icon-btn{
    border:1.5px solid var(--ink);background:transparent;color:var(--ink);
    width:34px;height:34px;display:grid;place-items:center;font-size:14px;border-radius:9px;
    transition:background .15s,color .15s,transform .15s;
  }
  .icon-btn:hover{background:var(--ink);color:var(--paper)}
  .fab{
    border:0;background:var(--berry);color:#fff;width:36px;height:36px;
    font-size:20px;line-height:1;display:grid;place-items:center;border-radius:10px;
    transition:transform .2s,filter .15s;box-shadow:0 4px 14px rgba(201,47,97,.3);
  }
  .fab:hover{transform:rotate(90deg);filter:brightness(1.08)}

  /* PAGE SYSTEM */
  .page{display:none}
  .page.active{display:block;animation:fade .32s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ============ DASHBOARD ============ */
  .cover{
    display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;
    border-top:2px solid var(--ink);position:relative;
  }
  .cover-left{padding:30px 34px 30px 0;border-right:1px solid rgba(41,38,49,.14);position:relative}
  .cover-right{padding:30px 0 30px 34px}

  .cover-issue{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--cherry);
    margin-bottom:18px;display:flex;align-items:center;gap:10px;
  }
  .cover-issue::before{content:'';width:26px;height:1px;background:var(--berry)}
  .cover-issue b{color:var(--ink)}
  .cover-date{
    font-family:var(--font-display);font-weight:900;letter-spacing:-.06em;
    font-size:clamp(56px,6.8vw,112px);line-height:.8;text-transform:uppercase;
  }
  .cover-date em{font-style:normal;color:var(--berry);position:relative}
  .cover-date em::after{
    content:'';position:absolute;left:0;right:0;bottom:8px;height:6px;
    background:var(--lemon);opacity:.55;border-radius:3px;z-index:-1;
  }
  .cover-greet{
    font-family:var(--font-serif);font-size:20px;line-height:1.5;color:var(--cherry);margin-top:22px;max-width:44ch;
    padding-left:16px;border-left:3px solid var(--lavender);font-style:italic;
  }

  .toc{margin-top:32px;border-top:1px solid rgba(41,38,49,.14);padding-top:18px}
  .toc-title{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--cherry);
    margin-bottom:12px;
  }
  .toc-row{
    display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:baseline;
    padding:11px 0;border-bottom:1px solid rgba(41,38,49,.09);font-size:14px;
    transition:padding-left .18s,background .18s;
  }
  .toc-row:hover{padding-left:6px}
  .toc-row:last-child{border-bottom:0}
  .toc-num{font-family:var(--font-mono);font-size:11px;color:var(--berry);letter-spacing:.06em;font-weight:600}
  .toc-name{font-weight:600}
  .toc-count{font-family:var(--font-mono);font-size:11.5px;color:#8a8295}

  .cover-art{
    height:232px;background:linear-gradient(135deg,var(--cherry),var(--berry));position:relative;overflow:hidden;
    display:grid;place-items:center;border-radius:var(--radius);
    box-shadow:0 10px 34px rgba(143,49,85,.24);
  }
  .cover-art::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 24% 16%,rgba(233,222,131,.5),transparent 52%),
               radial-gradient(circle at 84% 88%,rgba(168,138,232,.55),transparent 50%);
  }
  .cover-art::after{
    content:'';position:absolute;width:120px;height:120px;border:1.5px solid rgba(255,255,255,.22);
    border-radius:50%;top:-40px;right:-30px;
  }
  .cover-art-word{
    font-family:var(--font-display);font-weight:900;font-size:clamp(30px,3.2vw,46px);
    letter-spacing:-.05em;color:#fff;line-height:.88;text-transform:uppercase;text-align:center;padding:0 18px;
    position:relative;
  }
  .cover-art-meta{
    font-family:var(--font-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.85);
    margin-top:14px;text-align:center;position:relative;
  }

  .cover-side-block{margin-top:24px;border-top:1px solid rgba(41,38,49,.14);padding-top:18px}
  .cover-side-kicker{
    font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cherry);
    margin-bottom:8px;
  }
  .cover-big{
    font-family:var(--font-display);font-weight:900;letter-spacing:-.055em;line-height:.88;
    font-size:clamp(44px,5vw,68px);
  }
  .cover-big small{
    display:block;font-family:var(--font-display);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:#8a8295;margin-top:12px;
  }
  .cover-quote{
    font-family:var(--font-serif);font-style:italic;font-size:22px;line-height:1.35;letter-spacing:-.01em;margin-top:10px;color:var(--ink);
  }
  .cover-quote::before{content:'“';color:var(--berry);font-size:34px;line-height:0;vertical-align:-10px;margin-right:4px}

  /* editorial strip */
  .strip{
    display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:0;
    border-top:1px solid rgba(41,38,49,.14);margin-top:36px;
  }
  .strip-cell{padding:24px 28px;border-right:1px solid rgba(41,38,49,.14)}
  .strip-cell:last-child{border-right:0}
  .strip-cell:first-child{padding-left:0}
  .strip-k{
    font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cherry);
    margin-bottom:14px;
  }
  .strip-list{list-style:none;margin:0;padding:0}
  .strip-list li{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px dashed rgba(41,38,49,.14);font-size:13.5px}
  .strip-list li:last-child{border-bottom:0}
  .strip-list .t{font-family:var(--font-mono);font-size:11px;color:#8a8295}
  .strip-list .n{font-weight:600}
  .strip-list .n small{display:block;font-size:11px;font-weight:500;color:#8a8295;margin-top:2px}
  .badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:4px 9px;color:#fff;border-radius:5px}
  .badge.berry{background:var(--berry)}
  .badge.lavender{background:var(--lavender)}
  .badge.mint{background:var(--mint);color:var(--ink)}
  .badge.lemon{background:var(--lemon);color:var(--ink)}
  .badge.cherry{background:var(--cherry)}

  .habit-line{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(41,38,49,.14);font-size:13.5px}
  .habit-line:last-child{border-bottom:0}
  .hdots{display:flex;gap:5px}
  .hd{width:11px;height:11px;border-radius:50%;background:var(--grey)}
  .hd.on{background:var(--lavender)}
  .hd.hot{background:var(--berry)}

  /* ============ INNER PAGES ============ */
  .page-head{margin-bottom:26px;border-bottom:2px solid var(--ink);padding-bottom:16px;position:relative}
  .page-head h2{
    font-family:var(--font-display);font-weight:900;letter-spacing:-.06em;
    font-size:clamp(44px,5.4vw,82px);line-height:.82;text-transform:uppercase;margin:0;
  }
  .page-head h2 em{font-style:normal;color:var(--berry)}
  .page-head p{color:#6b6475;margin:16px 0 0;font-size:13.5px;max-width:66ch;line-height:1.6}
  .page-head::after{
    content:'';position:absolute;right:0;bottom:20px;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,var(--lilac),transparent 70%);opacity:.7;
  }

  /* PLANNER */
  .planner{display:grid;grid-template-columns:280px 1fr;gap:0;border-top:1px solid rgba(41,38,49,.14)}
  .planner-time{padding:26px 28px 26px 0;border-right:1px solid rgba(41,38,49,.14)}
  .planner-body{padding:26px 0 26px 32px}
  .time-row{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(41,38,49,.1);align-items:baseline}
  .time-row:last-child{border-bottom:0}
  .time-row .t{font-family:var(--font-mono);font-size:11.5px;color:var(--cherry)}
  .time-row .n{font-size:13.5px;font-weight:600;line-height:1.3}
  .time-row .n small{display:block;font-size:11px;font-weight:500;color:#8a8295;margin-top:2px}

  .note-block{background:var(--lilac);padding:22px 24px;border-left:3px solid var(--lavender);margin-bottom:18px;border-radius:0 12px 12px 0}
  .note-block h3{margin:0 0 9px;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.02em}
  .note-block p{margin:0;font-size:13.5px;line-height:1.6;color:#5d5766}
  .note-block.berry{background:var(--blush);border-left-color:var(--berry)}

  /* CALENDAR */
  .cal-tabs{display:flex;border:1.5px solid var(--ink);width:max-content;margin-bottom:24px;border-radius:9px;overflow:hidden}
  .cal-tabs button{border:0;border-right:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;transition:background .15s,color .15s}
  .cal-tabs button:last-child{border-right:0}
  .cal-tabs button.active{background:var(--ink);color:var(--paper)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid rgba(41,38,49,.14);border-left:1px solid rgba(41,38,49,.14)}
  .cal-cell{border-right:1px solid rgba(41,38,49,.14);border-bottom:1px solid rgba(41,38,49,.14);padding:13px;min-height:150px;transition:background .18s;position:relative}
  .cal-cell:hover{background:var(--lilac)}
  .cal-cell.today{background:var(--blush)}
  .cal-cell.today::after{content:'';position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--berry)}
  .cal-num{font-family:var(--font-display);font-weight:900;font-size:22px;letter-spacing:-.03em}
  .cal-dow{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--cherry);margin-top:2px}
  .cal-ev{margin-top:9px;font-size:11px;font-weight:700;line-height:1.2;padding-left:8px;border-left:2px solid var(--lavender)}
  .cal-ev.red{border-left-color:var(--berry)}
  .cal-ev.lemon{border-left-color:var(--lemon)}
  .cal-ev.mint{border-left-color:var(--mint)}

  /* TASKS */
  .tasks{display:grid;grid-template-columns:1fr 300px;gap:0;border-top:1px solid rgba(41,38,49,.14)}
  .tasks-main{padding:26px 32px 26px 0;border-right:1px solid rgba(41,38,49,.14)}
  .tasks-side{padding:26px 0 26px 32px}
  .task{display:grid;grid-template-columns:20px 1fr auto;gap:13px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(41,38,49,.1)}
  .task:last-child{border-bottom:0}
  .task-box{width:17px;height:17px;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;font-size:9px;color:transparent;margin-top:3px;border-radius:5px;transition:background .15s,color .15s,border-color .15s}
  .task-box.on{background:var(--lavender);border-color:var(--lavender);color:#fff}
  .task-n{font-size:14.5px;font-weight:600;line-height:1.3}
  .task-n small{display:block;font-size:11.5px;font-weight:500;color:#8a8295;margin-top:2px}
  .task-n.done{text-decoration:line-through;color:#8a8295;font-weight:500}
  .task-pri{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .task-pri.high{color:var(--berry)}
  .task-pri.mid{color:var(--cherry)}
  .task-pri.low{color:#8a8295}

  /* JOURNAL */
  .journal{
    background:linear-gradient(150deg,var(--ink) 0%,#3a2f44 100%);color:#F2EDE6;border-radius:18px;
    display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);
    margin:0;padding:40px 44px;position:relative;overflow:hidden;
  }
  .journal::before{
    content:'';position:absolute;top:-60px;right:-40px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(168,138,232,.28),transparent 70%);
  }
  .journal::after{
    content:'';position:absolute;bottom:-80px;left:-30px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,47,97,.22),transparent 70%);
  }
  .journal-left{border-right:1px solid rgba(255,255,255,.12);padding-right:36px;position:relative;z-index:1}
  .journal-right{padding-left:36px;position:relative;z-index:1}
  .j-issue{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,237,230,.55);margin-bottom:16px}
  .j-title{
    font-family:var(--font-display);font-weight:900;letter-spacing:-.055em;
    font-size:clamp(40px,5vw,68px);line-height:.84;text-transform:uppercase;
  }
  .j-title em{font-style:normal;color:var(--lemon)}
  .j-date{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,237,230,.6);margin:16px 0 22px}
  .journal-left textarea{
    width:100%;min-height:200px;resize:vertical;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);color:#F2EDE6;padding:18px;border-radius:12px;
    font-family:var(--font-display);font-size:14.5px;line-height:1.65;
  }
  .journal-left textarea::placeholder{color:rgba(242,237,230,.4)}
  .journal-left textarea:focus{outline:2px solid var(--lemon);outline-offset:-2px}
  .j-images{display:flex;gap:14px;margin-top:18px}
  .j-img{width:80px;height:80px;background:linear-gradient(135deg,var(--lavender),var(--cherry));position:relative;border-radius:12px}
  .j-img.alt{background:linear-gradient(135deg,var(--berry),var(--lemon))}
  .j-img-meta{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,237,230,.5);margin-top:7px}
  .j-prompt{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1)}
  .j-prompt:last-child{border-bottom:0}
  .j-prompt b{display:block;font-size:12.5px;margin-bottom:4px;color:#fff}
  .j-prompt span{font-size:11.5px;color:rgba(242,237,230,.6)}
  .j-mood{display:flex;gap:9px;margin-top:16px}
  .j-mood button{width:40px;height:40px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#F2EDE6;font-size:18px;display:grid;place-items:center;border-radius:11px;transition:border-color .15s,background .15s}
  .j-mood button.on{border-color:var(--lemon);background:rgba(233,222,131,.18)}

  /* IDEAS */
  .ideas{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;border-top:1px solid rgba(41,38,49,.14);padding-top:26px}
  .idea{border:1px solid rgba(41,38,49,.1);padding:20px 22px;background:#fff;border-radius:var(--radius);transition:transform .18s,box-shadow .18s}
  .idea:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(143,49,85,.1)}
  .idea.s3{grid-column:span 3}
  .idea.s4{grid-column:span 4}
  .idea.s5{grid-column:span 5}
  .idea.s6{grid-column:span 6}
  .idea.s7{grid-column:span 7}
  .idea-k{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--cherry);margin-bottom:10px}
  .idea-t{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15}
  .idea-txt{font-size:13px;line-height:1.55;color:#6b6475;margin-top:10px}
  .idea.accent{background:linear-gradient(135deg,var(--berry),var(--cherry));color:#fff;border-color:transparent}
  .idea.accent .idea-k{color:rgba(255,255,255,.75)}
  .idea.accent .idea-txt{color:rgba(255,255,255,.9)}
  .idea.lav{background:linear-gradient(135deg,var(--lavender),#8b6fd4);color:#fff;border-color:transparent}
  .idea.lav .idea-k{color:rgba(255,255,255,.75)}

  /* BOOKS */
  .books{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;padding-top:26px;border-top:1px solid rgba(41,38,49,.14)}
  .book{border:1px solid rgba(41,38,49,.1);background:#fff;border-radius:var(--radius);overflow:hidden;transition:transform .18s,box-shadow .18s}
  .book:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(143,49,85,.12)}
  .book-cover{height:180px;background:linear-gradient(135deg,var(--lavender),var(--cherry));position:relative;overflow:hidden}
  .book-cover::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(233,222,131,.35),transparent 60%)}
  .book-cover::before{content:'';position:absolute;width:80px;height:80px;border:1px solid rgba(255,255,255,.3);border-radius:50%;bottom:-20px;left:-20px}
  .book-cover.red{background:linear-gradient(135deg,var(--berry),#7a1f45)}
  .book-cover.lemon{background:linear-gradient(135deg,var(--lemon),#c9b84a)}
  .book-cover.ink{background:linear-gradient(135deg,var(--ink),#4a4155)}
  .book-cover.mint{background:linear-gradient(135deg,var(--mint),#8bb8a8)}
  .book-body{padding:18px 20px}
  .book-title{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.1}
  .book-author{font-size:11.5px;color:#8a8295;margin-top:5px}
  .book-status{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:10px;color:var(--berry)}
  .book-rating{font-family:var(--font-mono);font-size:11px;margin-top:4px;letter-spacing:.14em;color:var(--cherry)}

  /* PROGRESS */
  .prog{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border-top:1px solid rgba(41,38,49,.14);border-left:1px solid rgba(41,38,49,.14);margin-top:26px}
  .pcell{grid-column:span 4;border-right:1px solid rgba(41,38,49,.14);border-bottom:1px solid rgba(41,38,49,.14);padding:24px}
  .pcell h4{margin:0 0 14px;font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--cherry)}
  .pnum{font-family:var(--font-display);font-weight:900;font-size:56px;letter-spacing:-.055em;line-height:.84;color:var(--berry)}
  .pnum small{display:block;font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8a8295;margin-top:12px}
  .streak{display:flex;gap:5px;margin-top:14px}
  .streak i{width:10px;height:22px;background:var(--grey);border-radius:3px}
  .streak i.on{background:linear-gradient(180deg,var(--lavender),var(--berry))}
  .empty{grid-column:span 12;padding:30px;border-right:1px solid rgba(41,38,49,.14);border-bottom:1px solid rgba(41,38,49,.14);text-align:center;color:#8a8295;font-size:13px}

  /* ============ DEVICE MODES ============ */
  body.device-tablet .app{max-width:1080px;margin:0 auto;border-left:1px solid rgba(41,38,49,.12);border-right:1px solid rgba(41,38,49,.12)}
  body.device-phone .app{max-width:430px;margin:0 auto;border-left:1px solid rgba(41,38,49,.12);border-right:1px solid rgba(41,38,49,.12)}
  body.device-phone .sidebar{display:none}
  body.device-phone .canvas{padding:16px 18px 96px}
  body.device-phone .cover{grid-template-columns:1fr}
  body.device-phone .cover-left{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding-right:0;padding-bottom:26px}
  body.device-phone .cover-right{padding-left:0;padding-top:26px}
  body.device-phone .strip{grid-template-columns:1fr}
  body.device-phone .strip-cell{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding:18px 0}
  body.device-phone .planner{grid-template-columns:1fr}
  body.device-phone .planner-time{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding-right:0;padding-bottom:18px}
  body.device-phone .planner-body{padding-left:0;padding-top:18px}
  body.device-phone .cal-grid{grid-template-columns:repeat(2,1fr)}
  body.device-phone .tasks{grid-template-columns:1fr}
  body.device-phone .tasks-main{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding-right:0}
  body.device-phone .tasks-side{padding-left:0;padding-top:18px}
  body.device-phone .journal{grid-template-columns:1fr;padding:30px 22px;border-radius:0;margin:0 -18px}
  body.device-phone .journal-left{border-right:0;border-bottom:1px solid rgba(255,255,255,.12);padding-right:0;padding-bottom:24px}
  body.device-phone .journal-right{padding-left:0;padding-top:24px}
  body.device-phone .ideas{grid-template-columns:1fr}
  body.device-phone .idea[class*="s"]{grid-column:span 1}
  body.device-phone .fin{grid-template-columns:1fr}
  body.device-phone .fin-left{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding-right:0;padding-bottom:18px}
  body.device-phone .fin-right{padding-left:0;padding-top:18px}
  body.device-phone .prog{grid-template-columns:1fr}
  body.device-phone .pcell{grid-column:span 1}
  body.device-phone .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(248,245,240,.96);backdrop-filter:blur(14px);
    border-top:1.5px solid var(--ink);padding:10px 4px;justify-content:space-around;z-index:60;
  }
  body.device-phone .mobile-nav button{
    border:0;background:transparent;color:#8a8295;font-size:10px;font-weight:700;
    display:flex;flex-direction:column;gap:4px;align-items:center;padding:4px 6px;letter-spacing:.04em;
  }
  body.device-phone .mobile-nav button.active{color:var(--berry)}
  .mobile-nav{display:none}

  @media(max-width:1080px){
    .cover{grid-template-columns:1fr}
    .cover-left{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding-right:0;padding-bottom:26px}
    .cover-right{padding-left:0;padding-top:26px}
    .planner{grid-template-columns:1fr}
    .planner-time{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding-right:0;padding-bottom:18px}
    .planner-body{padding-left:0;padding-top:18px}
    .tasks{grid-template-columns:1fr}
    .tasks-main{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding-right:0}
    .tasks-side{padding-left:0;padding-top:18px}
    .journal{grid-template-columns:1fr;padding:30px 34px}
    .journal-left{border-right:0;border-bottom:1px solid rgba(255,255,255,.12);padding-right:0;padding-bottom:24px}
    .journal-right{padding-left:0;padding-top:24px}
    .fin{grid-template-columns:1fr}
    .fin-left{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding-right:0;padding-bottom:18px}
    .fin-right{padding-left:0;padding-top:18px}
  }
  @media(max-width:760px){
    .sidebar{position:fixed;left:0;top:0;z-index:50;background:var(--paper);transform:translateX(-100%);transition:transform .28s}
    .app.mobile-open .sidebar{transform:none}
    .canvas{padding:16px 18px 96px}
    .cover{grid-template-columns:1fr}
    .strip{grid-template-columns:1fr}
    .strip-cell{border-right:0;border-bottom:1px solid rgba(41,38,49,.14);padding:18px 0}
    .cal-grid{grid-template-columns:repeat(2,1fr)}
    .ideas{grid-template-columns:1fr}
    .idea[class*="s"]{grid-column:span 1}
    .prog{grid-template-columns:1fr}
    .pcell{grid-column:span 1}
    .journal{padding:30px 22px;border-radius:0;margin:0 -18px}
  }

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:var(--paper);padding:12px 22px;font-size:12px;
    font-family:var(--font-mono);letter-spacing:.04em;opacity:0;pointer-events:none;transition:.28s;z-index:100;
    border-radius:10px;box-shadow:0 8px 30px rgba(41,38,49,.3);
  }
  .toast.show{opacity:1;transform:translateX(-50%)}

/* NOMI v1 — functional UI layer */
.app-status{font:500 9px var(--font-mono);letter-spacing:.06em;color:#6b6475;max-width:145px;text-align:right}
.app-status.bad{color:#b4234d}
.page-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 22px}
.toolbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar-note,.muted{font-size:12px;color:#827b89}
.btn-primary,.btn-quiet{border:0;border-radius:9px;padding:10px 15px;font:700 12px var(--font-display);cursor:pointer;transition:transform .15s,filter .15s,background .15s}
.btn-primary{background:var(--berry);color:#fff;box-shadow:0 4px 12px rgba(201,47,97,.16)}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-quiet{background:var(--lilac);color:var(--ink)}
.btn-quiet:hover{background:var(--blush)}
.btn-primary:disabled,.btn-quiet:disabled{opacity:.55;cursor:wait}
.danger-text{color:#a12e50;background:#f4e3e9}
.date-control,.search-field{display:flex;align-items:center;gap:9px;font:600 11px var(--font-mono);color:var(--cherry);letter-spacing:.04em}
.date-control input,.search-field input{border:1px solid rgba(41,38,49,.2);border-radius:8px;background:rgba(255,255,255,.72);padding:9px 11px;color:var(--ink);font:500 12px var(--font-display);min-height:36px}
.search-field{min-width:min(320px,100%);flex:1;max-width:420px}
.search-field input{width:100%}
.search-field span{font-size:18px}
.tasks-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:30px;border-top:1px solid rgba(41,38,49,.14);padding-top:16px}
.task-list{min-width:0}
.task-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 28px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(41,38,49,.1)}
.task-check{width:23px;height:23px;border:1.5px solid var(--cherry);border-radius:7px;background:transparent;color:white;font-weight:800;display:grid;place-items:center}
.task-check.checked{background:var(--berry);border-color:var(--berry)}
.task-main{border:0;background:none;text-align:left;min-width:0;color:var(--ink);padding:0}
.task-main strong{display:block;font-size:14px;line-height:1.35}
.task-main small{display:block;color:#817989;font-size:11px;margin-top:4px;line-height:1.45}
.task-row.is-done .task-main strong{text-decoration:line-through;color:#99919d}
.priority-tag{font:600 9px var(--font-mono);padding:5px 7px;border-radius:6px;text-transform:uppercase}
.priority-tag.high{background:#f3dce5;color:#9c2d55}.priority-tag.mid{background:#ece4f7;color:#7656ad}.priority-tag.low{background:#e0eee8;color:#477565}
.icon-mini{border:0;background:transparent;color:#8a8295;font-size:17px;width:25px;height:25px;border-radius:6px;cursor:pointer}
.icon-mini:hover{background:var(--blush);color:var(--berry)}
.side-summary{border-left:1px solid rgba(41,38,49,.13);padding:10px 0 10px 22px}
.summary-number{font:800 42px var(--font-display);letter-spacing:-.06em;margin:4px 0 22px}
.summary-number small{font:500 14px var(--font-mono);color:#8a8295}
.summary-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(41,38,49,.12);font-size:12px}
.empty-state{padding:26px 18px;text-align:center;color:#817989;border:1px dashed rgba(41,38,49,.18);border-radius:12px;background:rgba(255,255,255,.28)}
.empty-state h3{font:700 15px var(--font-display);color:var(--ink);margin:7px 0}
.empty-state p{font-size:12px;line-height:1.5;margin:0 auto;max-width:40ch}
.empty-mark{font-size:22px;color:var(--lavender)}
.planner-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:0;border-top:1px solid rgba(41,38,49,.14)}
.planner-schedule{padding:20px 28px 20px 0;border-right:1px solid rgba(41,38,49,.13)}
.planner-notes{padding:20px 0 20px 28px}
.planner-item{display:grid;grid-template-columns:55px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(41,38,49,.1)}
.planner-time{font:500 11px var(--font-mono);color:var(--cherry)}
.planner-item-main b{display:block;font-size:13px}.planner-item-main small{display:block;color:#89818f;font-size:10px;margin-top:4px}
.note-card-actions{float:right;display:flex;gap:4px}
.calendar-toolbar{align-items:flex-start}
.calendar-title{display:flex;align-items:center;gap:10px}
.calendar-title h3{font:700 18px var(--font-display);margin:0;min-width:130px;text-align:center;text-transform:capitalize}
.cal-tabs{margin:0}
.cal-tabs button{padding:8px 12px}
.calendar-grid{border-top:1px solid rgba(41,38,49,.14)}
.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid rgba(41,38,49,.12)}
.calendar-weekdays span{text-align:center;padding:9px;font:500 10px var(--font-mono);color:#8a8295}
.calendar-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid rgba(41,38,49,.1)}
.calendar-cell{min-height:118px;padding:7px;border-right:1px solid rgba(41,38,49,.1);border-bottom:1px solid rgba(41,38,49,.1);min-width:0}
.calendar-cell.muted{opacity:.38;background:rgba(231,232,236,.2)}
.calendar-cell.is-today{background:rgba(240,220,229,.35)}
.calendar-cell.is-selected{box-shadow:inset 0 0 0 2px var(--berry)}
.calendar-day-link{border:0;background:none;color:var(--ink);font:700 12px var(--font-mono);padding:4px 6px;border-radius:6px;cursor:pointer}
.calendar-day-link:hover{background:var(--lilac)}
.calendar-cell-events{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.calendar-chip-wrap{display:flex;align-items:center;gap:2px;min-width:0}
.calendar-chip{display:block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;border-radius:4px;padding:4px 5px;text-align:left;font:500 9px var(--font-display);cursor:pointer;background:var(--lilac);color:#574a6c;flex:1}
.calendar-chip.task-chip{background:var(--blush);color:#883d5c}
.calendar-chip.event-chip.red{background:#f4dce3;color:#8f3155}
.calendar-chip.event-chip.lemon{background:#f2edc6;color:#615a24}
.calendar-chip.event-chip.mint{background:#deeee8;color:#416e60}
.calendar-chip.event-chip.lavender{background:#e9e1f7;color:#65528d}
.calendar-chip-wrap .icon-mini{width:16px;height:16px;font-size:12px;flex:0 0 16px}
.calendar-week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid rgba(41,38,49,.14)}
.calendar-week-col{padding:10px;min-height:220px;border-right:1px solid rgba(41,38,49,.1);border-bottom:1px solid rgba(41,38,49,.1)}
.calendar-week-col.is-today{background:rgba(240,220,229,.32)}
.calendar-week-col .calendar-chip-wrap{margin-top:7px}
.calendar-day-view{padding:20px 0;border-top:1px solid rgba(41,38,49,.14)}
.calendar-day-view h3{font:700 20px var(--font-display)}
.calendar-day-view .calendar-chip-wrap{max-width:560px;margin:8px 0}
.calendar-year-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.calendar-mini-month{padding:15px;border:1px solid rgba(41,38,49,.12);border-radius:10px;background:rgba(255,255,255,.25)}
.calendar-mini-month h4{margin:0 0 10px;font:700 14px var(--font-display);text-transform:capitalize}
.calendar-mini-month>div{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calendar-mini-month button{border:0;background:transparent;border-radius:5px;padding:5px 0;font:10px var(--font-mono);color:var(--ink);cursor:pointer}
.calendar-mini-month button.has-items{background:var(--lilac);font-weight:700}
.calendar-mini-month button.is-today{background:var(--berry);color:white}
.journal-editor{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:30px;padding:22px 0;border-top:1px solid rgba(41,38,49,.14)}
.journal-main textarea{width:100%;resize:vertical;border:1px solid rgba(41,38,49,.14);border-radius:10px;background:rgba(255,255,255,.55);padding:14px;color:var(--ink);font:13px/1.6 var(--font-display);min-height:145px}
.journal-main>textarea{min-height:260px;font-size:15px}
.reflection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.reflection-grid label{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--cherry)}
.reflection-grid textarea{min-height:90px}
.journal-aside{border-left:1px solid rgba(41,38,49,.12);padding-left:20px}
.j-mood{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.j-mood button{border:1px solid rgba(41,38,49,.14);border-radius:9px;background:white;width:34px;height:34px;font-size:17px}
.j-mood button.on{background:var(--blush);border-color:var(--berry);box-shadow:0 0 0 2px rgba(201,47,97,.1)}
.journal-save-note{font-size:11px;color:#8a8295;margin-top:16px;line-height:1.5}
.journal-attachments{margin-top:20px}
.attachment-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.attachment-thumb,.upload-tile{width:112px;height:112px;border-radius:10px;overflow:hidden;position:relative;background:var(--lilac);display:grid;place-items:center}
.attachment-thumb img{width:100%;height:100%;object-fit:cover}
.attachment-thumb .icon-mini{position:absolute;right:4px;top:4px;background:rgba(255,255,255,.85)}
.attachment-thumb span{font-size:10px;padding:8px;text-align:center}
.upload-tile{border:1px dashed rgba(41,38,49,.3);background:rgba(255,255,255,.3);cursor:pointer;color:var(--cherry);font-size:11px;text-align:center;gap:4px}
.upload-tile span{font-size:22px}
.journal-search-results{margin-top:24px}.journal-search-results button{display:flex;gap:16px;width:100%;border:0;border-bottom:1px solid rgba(41,38,49,.1);background:none;padding:10px;text-align:left;cursor:pointer}.journal-search-results button span{color:#817989;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;align-items:stretch;min-width:0}
.idea-card{grid-column:auto;min-width:0;min-height:190px;padding:22px;border-radius:13px;position:relative;display:flex;flex-direction:column}
.idea-card:nth-child(5n+1){grid-column:span 2}
.idea-card.paper{background:#fffdf9;border:1px solid rgba(41,38,49,.1)}
.idea-card.berry{background:linear-gradient(135deg,var(--berry),var(--cherry));color:#fff}
.idea-card.lavender{background:var(--lilac);color:var(--ink)}
.idea-card.mint{background:#e0eee8;color:var(--ink)}
.idea-card.lemon{background:#f2edc6;color:var(--ink)}
.idea-k{font:500 9px var(--font-mono);letter-spacing:.15em;text-transform:uppercase;opacity:.75}
.idea-t{font:700 20px/1.15 var(--font-display);margin:18px 0 8px;letter-spacing:-.03em}
.idea-txt{font-size:12px;line-height:1.55;opacity:.82}
.idea-actions{display:flex;gap:4px;margin-top:auto;padding-top:14px;justify-content:flex-end}
.idea-card.berry .icon-mini{color:white}.idea-card.berry .icon-mini:hover{background:rgba(255,255,255,.2)}
.books-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.book-card{border-radius:12px;overflow:hidden;background:rgba(255,255,255,.55);border:1px solid rgba(41,38,49,.1);min-width:0}
.book-cover-real{height:210px;background:linear-gradient(145deg,var(--lilac),var(--blush));display:grid;place-items:center;color:#796b8c;font:500 10px var(--font-mono);text-align:center}
.book-cover-real img{width:100%;height:100%;object-fit:cover}
.book-info{padding:14px}

<script>

/* =========================================================================
   NOMI — Data Layer (этап 6.2)
   Изолированный слой данных. Не изменяет существующий UI/навигацию.
   Архитектура: UI → Repository → Storage → IndexedDB
   Публичный API: window.NomiData
   ========================================================================= */
(function (global) {
  'use strict';

  /* ---------------------------------------------------------------
     Константы базы
     --------------------------------------------------------------- */
  const DB_NAME = 'nomi-db';
  const DB_VERSION = 2;
  const WRITE_LOCK_NAME = 'nomi:write';
  const BROADCAST_CHANNEL = 'nomi';

  /* 13 физических Object Stores — фиксированный список */
  const STORE = Object.freeze({
    TASKS: 'tasks',
    PLANNER_ENTRIES: 'planner_entries',
    PLANNER_NOTES: 'planner_notes',
    EVENTS: 'events',
    JOURNAL: 'journal',
    ATTACHMENTS: 'attachments',
    IDEAS: 'ideas',
    BOOKS: 'books',
    SETTINGS: 'settings',
    META: 'meta'
  });

  const STORE_NAMES = Object.freeze([
    STORE.TASKS,
    STORE.PLANNER_ENTRIES,
    STORE.PLANNER_NOTES,
    STORE.EVENTS,
    STORE.JOURNAL,
    STORE.ATTACHMENTS,
    STORE.IDEAS,
    STORE.BOOKS,
    STORE.SETTINGS,
    STORE.META
  ]);

  /* ---------------------------------------------------------------
     Перечисления / доменные константы
     --------------------------------------------------------------- */
  const TASK_STATUS = Object.freeze({ OPEN: 'open', DONE: 'done' });
  const TASK_PRIORITY = Object.freeze({ HIGH: 'high', MID: 'mid', LOW: 'low' });
  const PLANNER_KIND = Object.freeze({
    TASK: 'task',
    HABIT: 'habit',
    EVENT: 'event',
    JOURNAL: 'journal',
    GOAL: 'goal',
    CUSTOM: 'custom'
  });
  const IDEA_KINDS = Object.freeze([
    'idea',
    'note',
    'observation',
    'question',
    'quote'
  ]);
  const BOOK_STATUS = Object.freeze({
    PLANNED: 'planned',
    READING: 'reading',
    FINISHED: 'finished',
    ABANDONED: 'abandoned'
  });
  const ATTACHMENT_OWNER = Object.freeze({ JOURNAL: 'journal', BOOK: 'book' });
  const ALL_CATEGORY_KEY = '__all__';

  const SETTINGS_ID = 'settings';
  const DEFAULT_SETTINGS = Object.freeze({
    id: SETTINGS_ID,
    language: 'ru',
    theme: 'berry',
    schemaVersion: DB_VERSION
  });

  const SNAPSHOT_FORMAT = 'nomi-backup';
  const SNAPSHOT_VERSION = 1;

  /* ---------------------------------------------------------------
     Утилиты: UUID
     --------------------------------------------------------------- */
  function uuid() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    if (typeof crypto === 'undefined' || typeof crypto.getRandomValues !== 'function') {
      throw new Error('crypto.getRandomValues недоступен: невозможно сгенерировать UUID');
    }
    const buf = new Uint8Array(16);
    crypto.getRandomValues(buf);
    /* RFC 4122 v4 */
    buf[6] = (buf[6] & 0x0f) | 0x40;
    buf[8] = (buf[8] & 0x3f) | 0x80;
    const hex = [];
    for (let i = 0; i < 16; i++) hex.push(buf[i].toString(16).padStart(2, '0'));
    return (
      hex.slice(0, 4).join('') + '-' +
      hex.slice(4, 6).join('') + '-' +
      hex.slice(6, 8).join('') + '-' +
      hex.slice(8, 10).join('') + '-' +
      hex.slice(10, 16).join('')
    );
  }

  /* ---------------------------------------------------------------
     Утилиты: время
     --------------------------------------------------------------- */
  function nowIso() {
    return new Date().toISOString();
  }

  function todayKey(d) {
    const dt = d instanceof Date ? d : new Date();
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const day = String(dt.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function isValidDateKey(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const y = Number(s.slice(0, 4));
    const m = Number(s.slice(5, 7));
    const d = Number(s.slice(8, 10));
    if (y < 1900 || y > 2999 || m < 1 || m > 12 || d < 1) return false;
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }

  function isValidIsoUtc(s) {
    if (typeof s !== 'string') return false;
    if (!/Z$/.test(s)) return false;
    const t = Date.parse(s);
    return Number.isFinite(t);
  }

  /* ---------------------------------------------------------------
     Утилиты: общие
     --------------------------------------------------------------- */
  function assert(cond, msg) {
    if (!cond) throw new Error(msg || 'Assertion failed');
  }

  function toError(e, fallbackMsg) {
    if (e instanceof Error) return e;
    if (e && typeof e === 'object' && typeof e.message === 'string') {
      const err = new Error(e.message);
      err.name = e.name || 'Error';
      return err;
    }
    return new Error(fallbackMsg || String(e));
  }

  function deepClone(obj) {
    if (obj === null || typeof obj !== 'object') return obj;
    if (typeof structuredClone === 'function') {
      try { return structuredClone(obj); } catch (_) { /* fallthrough */ }
    }
    if (obj instanceof Blob) return obj;
    if (obj instanceof Date) return new Date(obj.getTime());
    if (Array.isArray(obj)) return obj.map(deepClone);
    const out = {};
    for (const k in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) {
        out[k] = deepClone(obj[k]);
      }
    }
    return out;
  }

  function safeJsonClone(obj) {
    try { return JSON.parse(JSON.stringify(obj)); }
    catch (_) { return null; }
  }

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v) && !(v instanceof Blob);
  }

  function isBlob(v) {
    return typeof Blob !== 'undefined' && v instanceof Blob;
  }

  function isNonEmptyString(v) {
    return typeof v === 'string' && v.length > 0;
  }

  function pick(obj, keys) {
    const out = {};
    for (const k of keys) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) out[k] = obj[k];
    }
    return out;
  }

  /* Публичный объект-заготовка (наполняется по мере частей) */
  const NomiData = {
    uuid,
    STORE,
    STORE_NAMES,
    DB_NAME,
    DB_VERSION,
    WRITE_LOCK_NAME,
    BROADCAST_CHANNEL,
    TASK_STATUS,
    TASK_PRIORITY,
    PLANNER_KIND,
    IDEA_KINDS,
    BOOK_STATUS,
    ATTACHMENT_OWNER,
    ALL_CATEGORY_KEY,
    SETTINGS_ID,
    SNAPSHOT_FORMAT,
    SNAPSHOT_VERSION,
    /* placeholder'ы — будут заполнены в следующих частях */
    Storage: null,
    Repo: null,
    Settings: null,
    Migrations: null,
    ExportImport: null
  };

  global.NomiData = NomiData;

  /* Внутренний namespace для сборки модулей по частям */
  const NOMI = (global.__NomiInternal = global.__NomiInternal || {});
  NOMI.uuid = uuid;
  NOMI.nowIso = nowIso;
  NOMI.todayKey = todayKey;
  NOMI.isValidDateKey = isValidDateKey;
  NOMI.isValidIsoUtc = isValidIsoUtc;
  NOMI.assert = assert;
  NOMI.toError = toError;
  NOMI.deepClone = deepClone;
  NOMI.safeJsonClone = safeJsonClone;
  NOMI.isPlainObject = isPlainObject;
  NOMI.isBlob = isBlob;
  NOMI.isNonEmptyString = isNonEmptyString;
  NOMI.pick = pick;
  NOMI.DEFAULT_SETTINGS = DEFAULT_SETTINGS;
  /* ---------------------------------------------------------------
     IndexedDB: промис-обёртки
     --------------------------------------------------------------- */
  function idbRequest(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB request failed'));
    });
  }

  function idbTxDone(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
      tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction error'));
    });
  }

  /* Выполнить последовательность операций внутри одной транзакции.
     ops(done) — функция, возвращающая промис. Транзакция коммитится,
     когда завершится этот промис и все ожидающие запросы. */
  async function runTx(db, stores, mode, executor) {
    const tx = db.transaction(stores, mode);
    const donePromise = idbTxDone(tx);
    let result;
    try {
      result = await executor(tx);
    } catch (e) {
      try { tx.abort(); } catch (_) { /* ignore */ }
      throw toError(e);
    }
    await donePromise;
    return result;
  }

  /* ---------------------------------------------------------------
     Storage
     Ответственность: открытие базы, доступ к stores, транзакции,
     низкоуровневый CRUD. Никакой доменной логики.
     --------------------------------------------------------------- */
  class Storage {
    constructor() {
      this.db = null;
      this._openPromise = null;
      this._closed = false;
    }

    get isOpen() { return !!this.db; }

    /* Открытие строго на текущей DB_VERSION. Если база отсутствует —
       создаётся полная схема через onupgradeneeded (вызывает Migrations). */
    openAtVersion(targetVersion, migrations, options) {
      const version = targetVersion || DB_VERSION;
      const opts = options || {};
      const self = this;
      if (this._openPromise && this.db && this.db.version === version) {
        return this._openPromise;
      }
      this._closed = false;
      this._openPromise = new Promise((resolve, reject) => {
        let req;
        try {
          req = indexedDB.open(DB_NAME, version);
        } catch (e) {
          reject(toError(e, 'Не удалось открыть IndexedDB'));
          return;
        }
        req.onupgradeneeded = (event) => {
          try {
            const db = req.result;
            const oldVersion = event.oldVersion || 0;
            const tx = req.transaction;
            if (typeof opts.onUpgradeNeeded === 'function') {
              opts.onUpgradeNeeded({ db, oldVersion, newVersion: version, tx });
            } else if (migrations && typeof migrations.upgrade === 'function') {
              migrations.upgrade({ db, oldVersion, newVersion: version, tx });
            } else {
              throw new Error('Нет обработчика onupgradeneeded');
            }
          } catch (e) {
            try { req.transaction.abort(); } catch (_) { /* ignore */ }
            reject(toError(e, 'Ошибка создания схемы IndexedDB'));
          }
        };
        req.onsuccess = () => {
          const db = req.result;
          self.db = db;
          db.onversionchange = () => {
            try { db.close(); } catch (_) { /* ignore */ }
            self.db = null;
            self._openPromise = null;
            if (typeof self.onVersionChange === 'function') {
              try { self.onVersionChange(); } catch (_) { /* ignore */ }
            }
          };
          db.onclose = () => {
            self.db = null;
            self._openPromise = null;
          };
          resolve(db);
        };
        req.onerror = () => {
          reject(req.error || new Error('IndexedDB open failed'));
        };
        req.onblocked = () => {
          if (typeof opts.onBlocked === 'function') {
            try { opts.onBlocked(); } catch (_) { /* ignore */ }
          }
        };
      });
      return this._openPromise;
    }

    close() {
      this._closed = true;
      if (this.db) {
        try { this.db.close(); } catch (_) { /* ignore */ }
      }
      this.db = null;
      this._openPromise = null;
    }

    _ensureDb() {
      if (!this.db) throw new Error('Storage: база не открыта');
      return this.db;
    }

    _store(name) {
      const db = this._ensureDb();
      const tx = db.transaction(name, 'readonly');
      return tx.objectStore(name);
    }

    /* -------- Чтение -------- */
    async get(storeName, key) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readonly', (tx) => {
        return idbRequest(tx.objectStore(storeName).get(key));
      });
    }

    async getAll(storeName) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readonly', (tx) => {
        return idbRequest(tx.objectStore(storeName).getAll());
      });
    }

    async getAllByIndex(storeName, indexName, query) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readonly', (tx) => {
        const idx = tx.objectStore(storeName).index(indexName);
        const req = (query === undefined) ? idx.getAll() : idx.getAll(query);
        return idbRequest(req);
      });
    }

    async getAllKeys(storeName) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readonly', (tx) => {
        return idbRequest(tx.objectStore(storeName).getAllKeys());
      });
    }

    async count(storeName) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readonly', (tx) => {
        return idbRequest(tx.objectStore(storeName).count());
      });
    }

    /* -------- Запись -------- */
    async put(storeName, value) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readwrite', (tx) => {
        return idbRequest(tx.objectStore(storeName).put(value));
      });
    }

    async bulkPut(storeName, values) {
      const db = this._ensureDb();
      const arr = Array.isArray(values) ? values : [];
      return runTx(db, storeName, 'readwrite', (tx) => {
        const store = tx.objectStore(storeName);
        const reqs = arr.map((v) => idbRequest(store.put(v)));
        return Promise.all(reqs);
      });
    }

    async add(storeName, value) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readwrite', (tx) => {
        return idbRequest(tx.objectStore(storeName).add(value));
      });
    }

    async delete(storeName, key) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readwrite', (tx) => {
        return idbRequest(tx.objectStore(storeName).delete(key));
      });
    }

    async clear(storeName) {
      const db = this._ensureDb();
      return runTx(db, storeName, 'readwrite', (tx) => {
        return idbRequest(tx.objectStore(storeName).clear());
      });
    }

    /* Полное чтение произвольного store в отдельной транзакции —
       используется для dumpAll и валидации. */
    async readWholeStore(storeName) {
      return this.getAll(storeName);
    }

    /* Множественное чтение нескольких stores в одной read-транзакции. */
    async readMany(storeNames) {
      const db = this._ensureDb();
      const names = Array.isArray(storeNames) ? storeNames.slice() : [];
      if (names.length === 0) return {};
      return runTx(db, names, 'readonly', async (tx) => {
        const out = {};
        for (const n of names) {
          out[n] = await idbRequest(tx.objectStore(n).getAll());
        }
        return out;
      });
    }

    /* Пакетная запись в несколько stores одной транзакцией.
       ops — { storeName: [values] } (put). */
    async writeMany(map) {
      const db = this._ensureDb();
      const names = Object.keys(map || {});
      if (names.length === 0) return {};
      return runTx(db, names, 'readwrite', async (tx) => {
        const out = {};
        for (const n of names) {
          const store = tx.objectStore(n);
          const arr = Array.isArray(map[n]) ? map[n] : [];
          out[n] = await Promise.all(arr.map((v) => idbRequest(store.put(v))));
        }
        return out;
      });
    }

    /* Транзакция с произвольным исполнителем — для репозитория. */
    async writeTx(storeNames, executor) {
      const db = this._ensureDb();
      const names = Array.isArray(storeNames) ? storeNames : [storeNames];
      return runTx(db, names, 'readwrite', (tx) => executor(tx, idbRequest));
    }

    async readTx(storeNames, executor) {
      const db = this._ensureDb();
      const names = Array.isArray(storeNames) ? storeNames : [storeNames];
      return runTx(db, names, 'readonly', (tx) => executor(tx, idbRequest));
    }

    /* -------- Settings / meta shortcuts -------- */
    async getSettings() {
      const s = await this.get(STORE.SETTINGS, SETTINGS_ID);
      return s || null;
    }

    async putSettings(value) {
      assert(value && value.id === SETTINGS_ID, 'Settings.id должен быть "' + SETTINGS_ID + '"');
      return this.put(STORE.SETTINGS, value);
    }

    async getMeta(key) {
      const row = await this.get(STORE.META, key);
      return row ? row.value : undefined;
    }

    async putMeta(key, value) {
      return this.put(STORE.META, { key, value });
    }

    async getAllMeta() {
      return this.getAll(STORE.META);
    }

    async writeSchemaVersion(version, tx) {
      /* Вызывается из onupgradeneeded, где tx уже предоставлена. */
      assert(tx, 'writeSchemaVersion: требуется активная транзакция');
      const store = tx.objectStore(STORE.META);
      store.put({ key: 'schemaVersion', value: version });
    }
  }

  /* Экспорт */
  NOMI.idbRequest = idbRequest;
  NOMI.idbTxDone = idbTxDone;
  NOMI.runTx = runTx;
  NOMI.Storage = Storage;
  NomiData.Storage = Storage;
  /* ---------------------------------------------------------------
     Web Locks — общий shared-лок на все операции записи Repository
     --------------------------------------------------------------- */
  function locksAvailable() {
    return typeof navigator !== 'undefined' &&
      navigator.locks &&
      typeof navigator.locks.request === 'function';
  }

  let fallbackWriteQueue = Promise.resolve();
  function withWriteLock(fn) {
    if (!locksAvailable()) {
      /* Fallback сериализует записи внутри текущей вкладки. Межвкладочную
         миграцию без Web Locks bootstrap отдельно блокирует для старой БД. */
      const run = fallbackWriteQueue.then(
        () => Promise.resolve().then(fn),
        () => Promise.resolve().then(fn)
      );
      fallbackWriteQueue = run.catch(() => undefined);
      return run;
    }
    /* Все Repository writes должны быть взаимоисключающими: shared-lock
       допускает параллельные read-modify-write операции и гонки. */
    return navigator.locks.request(
      WRITE_LOCK_NAME,
      { mode: 'exclusive' },
      () => Promise.resolve().then(fn)
    );
  }

  /* ---------------------------------------------------------------
     Хелперы нормализации / валидации задач
     --------------------------------------------------------------- */
  const TASK_FIELDS = [
    'id', 'title', 'note', 'dueDate', 'dueTime', 'priority',
    'status', 'completedAt', 'category', 'createdAt', 'updatedAt', 'deletedAt'
  ];

  function normalizeTask(input, opts) {
    const o = opts || {};
    const src = input || {};
    const now = nowIso();
    const out = {
      id: isNonEmptyString(src.id) ? src.id : uuid(),
      title: typeof src.title === 'string' ? src.title.trim() : '',
      note: typeof src.note === 'string' ? src.note : '',
      dueDate: (src.dueDate === null || src.dueDate === undefined || src.dueDate === '')
        ? null
        : (isValidDateKey(src.dueDate) ? src.dueDate : null),
      dueTime: (src.dueTime === null || src.dueTime === undefined || src.dueTime === '')
        ? null
        : (typeof src.dueTime === 'string' ? src.dueTime : null),
      priority: (src.priority === TASK_PRIORITY.HIGH ||
                 src.priority === TASK_PRIORITY.MID ||
                 src.priority === TASK_PRIORITY.LOW)
        ? src.priority : TASK_PRIORITY.MID,
      status: (src.status === TASK_STATUS.DONE || src.status === TASK_STATUS.OPEN)
        ? src.status : TASK_STATUS.OPEN,
      completedAt: isNonEmptyString(src.completedAt) ? src.completedAt : null,
      category: typeof src.category === 'string' ? src.category : '',
      createdAt: isNonEmptyString(src.createdAt) ? src.createdAt : (o.isNew ? now : now),
      updatedAt: now,
      deletedAt: isNonEmptyString(src.deletedAt) ? src.deletedAt : null
    };
    if (!o.isNew && isNonEmptyString(src.createdAt)) out.createdAt = src.createdAt;
    if (out.status === TASK_STATUS.DONE && !out.completedAt) out.completedAt = now;
    if (out.status === TASK_STATUS.OPEN) out.completedAt = null;
    return out;
  }

  function validateTask(t) {
    assert(isPlainObject(t), 'Task должен быть объектом');
    assert(isNonEmptyString(t.id), 'Task.id обязателен');
    assert(typeof t.title === 'string' && t.title.length > 0, 'Task.title обязателен');
    assert(t.priority === TASK_PRIORITY.HIGH || t.priority === TASK_PRIORITY.MID || t.priority === TASK_PRIORITY.LOW,
      'Task.priority недопустим');
    assert(t.status === TASK_STATUS.OPEN || t.status === TASK_STATUS.DONE, 'Task.status недопустим');
    assert(t.dueDate === null || isValidDateKey(t.dueDate), 'Task.dueDate неверный формат');
    assert(isValidIsoUtc(t.createdAt), 'Task.createdAt должен быть ISO UTC');
    assert(isValidIsoUtc(t.updatedAt), 'Task.updatedAt должен быть ISO UTC');
    assert(t.deletedAt === null || isValidIsoUtc(t.deletedAt), 'Task.deletedAt должен быть ISO UTC или null');
    return true;
  }

  /* ---------------------------------------------------------------
     Repo (фабрика)
     --------------------------------------------------------------- */
  function createRepo(storage) {
    assert(storage instanceof Storage, 'Repo: требуется Storage');

    async function getTaskRaw(id) {
      if (!isNonEmptyString(id)) return null;
      return storage.get(STORE.TASKS, id);
    }

    const tasks = {
      async get(id) {
        return getTaskRaw(id);
      },

      async list() {
        const all = await storage.getAll(STORE.TASKS);
        return all.filter((t) => !t.deletedAt);
      },

      async listAll() {
        return storage.getAll(STORE.TASKS);
      },

      async getByDate(dateKey) {
        assert(isValidDateKey(dateKey), 'tasks.getByDate: неверная дата');
        const rows = await storage.getAllByIndex(STORE.TASKS, 'by_date', dateKey);
        return rows.filter((t) => !t.deletedAt);
      },

      async getByStatus(status) {
        assert(status === TASK_STATUS.OPEN || status === TASK_STATUS.DONE, 'tasks.getByStatus: неверный статус');
        const rows = await storage.getAllByIndex(STORE.TASKS, 'by_status', status);
        return rows.filter((t) => !t.deletedAt);
      },

      async create(input) {
        const draft = normalizeTask(input || {}, { isNew: true });
        validateTask(draft);
        return withWriteLock(async () => {
          /* Гарантия отсутствия ID-коллизии */
          const existing = await getTaskRaw(draft.id);
          if (existing) throw new Error('Task с таким id уже существует');
          await storage.put(STORE.TASKS, draft);
          return draft;
        });
      },

      async update(id, patch) {
        assert(isNonEmptyString(id), 'tasks.update: id обязателен');
        return withWriteLock(async () => {
          const current = await getTaskRaw(id);
          if (!current) throw new Error('Task не найден: ' + id);
          if (current.deletedAt) throw new Error('Task удалён (soft delete): ' + id);
          const merged = Object.assign({}, current, patch || {}, { id: current.id, createdAt: current.createdAt });
          const normalized = normalizeTask(merged, { isNew: false });
          normalized.id = current.id;
          normalized.createdAt = current.createdAt;
          validateTask(normalized);
          await storage.put(STORE.TASKS, normalized);
          return normalized;
        });
      },

      async complete(id) {
        assert(isNonEmptyString(id), 'tasks.complete: id обязателен');
        return withWriteLock(async () => {
          const current = await getTaskRaw(id);
          if (!current) throw new Error('Task не найден: ' + id);
          if (current.deletedAt) throw new Error('Task удалён: ' + id);
          if (current.status === TASK_STATUS.DONE) return current;
          const updated = Object.assign({}, current, {
            status: TASK_STATUS.DONE,
            completedAt: nowIso(),
            updatedAt: nowIso()
          });
          validateTask(updated);
          await storage.put(STORE.TASKS, updated);
          return updated;
        });
      },

      async reopen(id) {
        assert(isNonEmptyString(id), 'tasks.reopen: id обязателен');
        return withWriteLock(async () => {
          const current = await getTaskRaw(id);
          if (!current) throw new Error('Task не найден: ' + id);
          if (current.deletedAt) throw new Error('Task удалён: ' + id);
          const updated = Object.assign({}, current, {
            status: TASK_STATUS.OPEN,
            completedAt: null,
            updatedAt: nowIso()
          });
          validateTask(updated);
          await storage.put(STORE.TASKS, updated);
          return updated;
        });
      },

      async toggle(id) {
        const current = await getTaskRaw(id);
        if (!current) throw new Error('Task не найден: ' + id);
        if (current.status === TASK_STATUS.DONE) return tasks.reopen(id);
        return tasks.complete(id);
      },

      /* Soft delete Task:
         — ставит deletedAt;
         — отвязывает PlannerEntry (linkedTaskId → null),
           сохраняя title/note как кэш;
         — PlannerEntry не удаляются. */
      async softDelete(id) {
        assert(isNonEmptyString(id), 'tasks.softDelete: id обязателен');
        return withWriteLock(async () => {
          const current = await getTaskRaw(id);
          if (!current) throw new Error('Task не найден: ' + id);
          if (current.deletedAt) return current;
          const stamp = nowIso();
          const updated = Object.assign({}, current, {
            deletedAt: stamp,
            updatedAt: stamp
          });
          validateTask(updated);
          await storage.put(STORE.TASKS, updated);

          /* Отвязка PlannerEntry */
          const linked = await storage.getAllByIndex(STORE.PLANNER_ENTRIES, 'by_task', id);
          if (linked && linked.length) {
            const patched = linked.map((entry) => {
              const title = isNonEmptyString(entry.title) ? entry.title : (current.title || '');
              const note = isNonEmptyString(entry.note) ? entry.note : (current.note || '');
              return Object.assign({}, entry, {
                linkedTaskId: null,
                title: title,
                note: note,
                updatedAt: stamp
              });
            });
            await storage.bulkPut(STORE.PLANNER_ENTRIES, patched);
          }
          return updated;
        });
      },

      /* Физическое удаление (для purge/миграций). */
      async purge(id) {
        assert(isNonEmptyString(id), 'tasks.purge: id обязателен');
        return withWriteLock(async () => {
          await storage.delete(STORE.TASKS, id);
          return true;
        });
      },

      _normalize: normalizeTask,
      _validate: validateTask
    };

    const repo = {
      storage,
      tasks,
      /* Заглушки для последующих частей — заполняются последовательно. */
      plannerEntries: null,
      plannerNotes: null,
      events: null,
      journal: null,
      attachments: null,
      ideas: null,
      books: null
    };

    return repo;
  }

  NOMI.withWriteLock = withWriteLock;
  NOMI.locksAvailable = locksAvailable;
  NOMI.createRepo = createRepo;
  NOMI.normalizeTask = normalizeTask;
  NOMI.validateTask = validateTask;
  /* ---------------------------------------------------------------

  function normalizePlannerEntry(input, opts) {

      src.kind === PLANNER_KIND.HABIT ||
      src.kind === PLANNER_KIND.EVENT ||
      src.kind === PLANNER_KIND.JOURNAL ||
      src.kind === PLANNER_KIND.GOAL ||
      src.kind === PLANNER_KIND.CUSTOM;
    return {
      id: isNonEmptyString(src.id) ? src.id : uuid(),
      date: isValidDateKey(src.date) ? src.date : null,
      time: (src.time === null || src.time === undefined || src.time === '')
        ? null
        : (typeof src.time === 'string' ? src.time : null),
      title: typeof src.title === 'string' ? src.title : '',
      note: typeof src.note === 'string' ? src.note : '',
      kind: kindOk ? src.kind : PLANNER_KIND.CUSTOM,
      linkedTaskId: isNonEmptyString(src.linkedTaskId) ? src.linkedTaskId : null,
      createdAt: isNonEmptyString(src.createdAt) ? src.createdAt : (o.isNew ? now : now),
      updatedAt: now,
      deletedAt: isNonEmptyString(src.deletedAt) ? src.deletedAt : null

  function validatePlannerEntry(e) {

    assert(isValidDateKey(e.date), 'PlannerEntry.date обязателен и формата YYYY-MM-DD');
    assert(e.time === null || typeof e.time === 'string', 'PlannerEntry.time: строка или null');
    assert(typeof e.title === 'string', 'PlannerEntry.title: строка');
    assert(e.kind === PLANNER_KIND.TASK || e.kind === PLANNER_KIND.HABIT ||
           e.kind === PLANNER_KIND.EVENT || e.kind === PLANNER_KIND.JOURNAL ||
           e.kind === PLANNER_KIND.GOAL || e.kind === PLANNER_KIND.CUSTOM, 'PlannerEntry.kind недопустим');
    assert(e.linkedTaskId === null || isNonEmptyString(e.linkedTaskId), 'PlannerEntry.linkedTaskId: строка или null');
    assert(isValidIsoUtc(e.createdAt), 'PlannerEntry.createdAt должен быть ISO UTC');
    assert(isValidIsoUtc(e.updatedAt), 'PlannerEntry.updatedAt должен быть ISO UTC');
    assert(e.deletedAt === null || isValidIsoUtc(e.deletedAt), 'PlannerEntry.deletedAt должен быть ISO UTC или null');
    return true;

  /* ---------------------------------------------------------------
     Хелперы нормализации / валидации: PlannerNote
     --------------------------------------------------------------- */
  function normalizePlannerNote(input, opts) {
    const o = opts || {};
    const src = input || {};
    const now = nowIso();
    return {
      id: isNonEmptyString(src.id) ? src.id : uuid(),
      date: isValidDateKey(src.date) ? src.date : null,
      title: typeof src.title === 'string' ? src.title : '',

  function validatePlannerNote(n) {
    assert(isPlainObject(n), 'PlannerNote должен быть объектом');
    assert(isNonEmptyString(n.id), 'PlannerNote.id обязателен');

     --------------------------------------------------------------- */
  function normalizeJournalEntry(input, opts) {
    const o = opts || {};
    const src = input || {};
    const now = nowIso();
    let prompts;
    if (Array.isArray(src.prompts)) {
      /* Сохраняем пустые позиции: UI использует фиксированные поля
         рефлексии (gratitude / good / takeaway), их порядок значим. */
      prompts = src.prompts.map((p) => {
        if (typeof p === 'string') return p;
        if (isPlainObject(p) && typeof p.text === 'string') return p.text;
        return '';
      });
    } else if (typeof src.prompts === 'string' && src.prompts.length > 0) {
      prompts = [src.prompts];
    } else {
      prompts = [];
    }
    const mood = (src.mood === null || src.mood === undefined || src.mood === '')
      ? null
      : (typeof src.mood === 'string' ? src.mood : null);
    return {
      id: isNonEmptyString(src.id) ? src.id : uuid(),
      date: isValidDateKey(src.date) ? src.date : null,
      body: typeof src.body === 'string' ? src.body : '',
      mood: mood,
      prompts: prompts,
      tags: Array.isArray(src.tags) ? [...new Set(src.tags.map(x=>String(x||'').trim()).filter(Boolean))] : (typeof src.tags==='string'? [...new Set(src.tags.split(',').map(x=>x.trim()).filter(Boolean))] : []),
      createdAt: isNonEmptyString(src.createdAt) ? src.createdAt : (o.isNew ? now : now),
      updatedAt: now,
      deletedAt: isNonEmptyString(src.deletedAt) ? src.deletedAt : null
    };
  }

    assert(j.mood === null || typeof j.mood === 'string', 'JournalEntry.mood: строка или null');
    assert(Array.isArray(j.prompts), 'JournalEntry.prompts: массив');

  function normalizeAttachment(input, opts) {

        ? attachmentOwnerKey(src.ownerType, src.ownerId) : '',
      mime: typeof src.mime === 'string' ? src.mime : 'application/octet-stream',
      bytes: Number.isFinite(bytes) && bytes >= 0 ? Math.round(bytes) : 0,
      blob: isBlob(src.blob) ? src.blob : null,
      createdAt: isNonEmptyString(src.createdAt) ? src.createdAt : (o.isNew ? now : now),

    repo.journal = {

      async getByDate(dateKey) {
        assert(isValidDateKey(dateKey), 'journal.getByDate: неверная дата');
        const rows = await storage.getAllByIndex(STORE.JOURNAL, 'by_date', dateKey);
        /* Уникальный индекс — но на всякий случай вернём первый не удалённый */
        const alive = rows.filter((j) => !j.deletedAt);
        return alive.length ? alive[0] : null;
      },

      async getByDateRaw(dateKey) {
        assert(isValidDateKey(dateKey), 'journal.getByDateRaw: неверная дата');
        const rows = await storage.getAllByIndex(STORE.JOURNAL, 'by_date', dateKey);
        return rows.length ? rows[0] : null;
      },

      async upsertByDate(input) {
        assert(isPlainObject(input), 'journal.upsertByDate: входной объект обязателен');
        assert(isValidDateKey(input.date), 'journal.upsertByDate: date обязательна');
        const dateKey = input.date;
        return withWriteLock(async () => {
          const existing = await repo.journal.getByDateRaw(dateKey);
          if (existing && !existing.deletedAt) {
            /* Обновление живой записи */
            const merged = Object.assign({}, existing, input, {
              id: existing.id,
              createdAt: existing.createdAt
            });
            const normalized = normalizeJournalEntry(merged, { isNew: false });
            normalized.id = existing.id;
            normalized.createdAt = existing.createdAt;
            validateJournalEntry(normalized);
            await storage.put(STORE.JOURNAL, normalized);
            return normalized;
          }
          if (existing && existing.deletedAt) {
            /* Восстановление soft-deleted записи с тем же id */
            const merged = Object.assign({}, existing, input, {
              id: existing.id,
              createdAt: existing.createdAt,
              deletedAt: null
            });
            const normalized = normalizeJournalEntry(merged, { isNew: false });
            normalized.id = existing.id;
            normalized.createdAt = existing.createdAt;
            normalized.deletedAt = null;
            validateJournalEntry(normalized);
            await storage.put(STORE.JOURNAL, normalized);
            /* Восстанавливаем только вложения, удалённые тем же каскадом
               (совпадает deletedAt), но не удалённые отдельно. */
            const ownerKey = attachmentOwnerKey(ATTACHMENT_OWNER.JOURNAL, existing.id);
            const attached = await storage.getAllByIndex(STORE.ATTACHMENTS, 'by_owner', ownerKey);
            const restore = attached
              .filter((a) => a.deletedAt && a.deletedAt === existing.deletedAt)
              .map((a) => Object.assign({}, a, { deletedAt: null, updatedAt: nowIso() }));
            if (restore.length) await storage.bulkPut(STORE.ATTACHMENTS, restore);
            return normalized;
          }
          /* Новая запись */
          const draft = normalizeJournalEntry(input, { isNew: true });
          validateJournalEntry(draft);
          await storage.put(STORE.JOURNAL, draft);
          return draft;
        });

        const dateKey = input && input.date;
        assert(isValidDateKey(dateKey), 'journal.create: date обязательна');
        return withWriteLock(async () => {
          const existing = await repo.journal.getByDateRaw(dateKey);
          if (existing) throw new Error('JournalEntry с такой датой уже существует (используйте upsertByDate)');
          const draft = normalizeJournalEntry(input, { isNew: true });
          validateJournalEntry(draft);

        });
      },

        assert(isNonEmptyString(id), 'journal.update: id обязателен');
        return withWriteLock(async () => {
          const current = await storage.get(STORE.JOURNAL, id);

  function normalizeBook(input, opts) {
    const o = opts || {};
    const src = input || {};
    const now = nowIso();
    const statusOk =
      src.status === BOOK_STATUS.PLANNED ||
      src.status === BOOK_STATUS.READING ||
      src.status === BOOK_STATUS.FINISHED ||
      src.status === BOOK_STATUS.ABANDONED;
    const rating = Number(src.rating);
    return {
      id: isNonEmptyString(src.id) ? src.id : uuid(),
      title: typeof src.title === 'string' ? src.title.trim() : '',
      author: typeof src.author === 'string' ? src.author : '',
      status: statusOk ? src.status : BOOK_STATUS.PLANNED,
      rating: Number.isFinite(rating) && rating >= 0 && rating <= 5 ? rating : null,
      coverAttachmentId: isNonEmptyString(src.coverAttachmentId) ? src.coverAttachmentId : null,
      createdAt: isNonEmptyString(src.createdAt) ? src.createdAt : (o.isNew ? now : now),
      updatedAt: now,
      deletedAt: isNonEmptyString(src.deletedAt) ? src.deletedAt : null
    };
  }

  function validateBook(b) {
    assert(isPlainObject(b), 'Book должен быть объектом');
    assert(isNonEmptyString(b.id), 'Book.id обязателен');
    assert(typeof b.title === 'string' && b.title.length > 0, 'Book.title обязателен');
    assert(typeof b.author === 'string', 'Book.author: строка');
    assert(b.status === BOOK_STATUS.PLANNED || b.status === BOOK_STATUS.READING ||
           b.status === BOOK_STATUS.FINISHED || b.status === BOOK_STATUS.ABANDONED,
      'Book.status недопустим');
    assert(b.rating === null || (Number.isFinite(b.rating) && b.rating >= 0 && b.rating <= 5),
      'Book.rating: число 0..5 или null');
    assert(b.coverAttachmentId === null || isNonEmptyString(b.coverAttachmentId),
      'Book.coverAttachmentId: строка UUID или null');
    assert(isValidIsoUtc(b.createdAt), 'Book.createdAt должен быть ISO UTC');
    assert(isValidIsoUtc(b.updatedAt), 'Book.updatedAt должен быть ISO UTC');
    assert(b.deletedAt === null || isValidIsoUtc(b.deletedAt), 'Book.deletedAt: ISO UTC или null');
    return true;
  }
